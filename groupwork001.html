<!-- Static hosting compatible HTML. Password: g. Images are loaded from ./gw01img/ -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>グループワークその１</title>
<style>
  :root {
    --panel: #121a30;
    --panel2: #17223f;
    --line: #31436d;
    --text: #eaf0ff;
    --muted: #9fb0d9;
    --accent: #7cb7ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: Arial, "Helvetica Neue", Helvetica, "Yu Gothic", "Yu Gothic UI", Meiryo, sans-serif;
    line-height: 1.4;
    background: linear-gradient(180deg, #08101d, #10172d);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    overflow: hidden;
  }
  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .top {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 20px 20px 0;
    overflow: hidden;
  }
  .title-wrap {
    flex: 0 0 auto;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 28px;
  }
  button {
    border: 1px solid var(--line);
    background: var(--panel2);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    font-family: inherit;
    line-height: 1.2;
  }
  button:hover { filter: brightness(1.08); }
  .answer-link-btn { display:inline-flex; align-items:center; justify-content:center; text-decoration:none; background:#1f6feb; color:#fff; border:none; border-radius:10px; padding:10px 16px; font-weight:700; box-shadow:0 4px 10px rgba(0,0,0,.15); margin-left:10px; }
  .answer-link-btn:hover { filter: brightness(1.08); }
  .panel {
    background: rgba(18,26,48,.92);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .answer-panel {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .answer-actions { display:flex; align-items:center; gap:10px; }
  .answer-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin: 0 0 12px;
    flex: 0 0 auto;
  }
  .answer-title {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .answer-title h2,
  .item-header h2 {
    margin: 0;
    font-size: 20px;
  }
  .answer-note {
    font-size: 12px;
    color: var(--muted);
    font-weight: 700;
  }
  .answer-scroll {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding-right: 6px;
    scrollbar-gutter: stable;
  }
  .answer-groups {
    display: grid;
    gap: 18px;
    min-width: 980px;
    padding-bottom: 10px;
  }
  .answer-group {
    display: grid;
    gap: 10px;
  }
  .answer-group-title {
    margin: 0;
    font-size: 18px;
    color: #ffffff;
    font-weight: 800;
  }
  .answer-row {
    display: grid;
    gap: 12px;
  }
  .answer-row.cols-2 { grid-template-columns: repeat(2, minmax(150px, 1fr)); }
  .answer-row.cols-3 { grid-template-columns: repeat(3, minmax(150px, 1fr)); }
  .answer-row.cols-4 { grid-template-columns: repeat(4, minmax(150px, 1fr)); }
  .answer-row.cols-5 { grid-template-columns: repeat(5, minmax(150px, 1fr)); }

  .slot-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .slot-no {
    font-size: 12px;
    color: var(--muted);
    font-weight: 800;
    letter-spacing: .04em;
  }
  .slot {
    background: rgba(255,255,255,.03);
    border: 2px dashed #3f5589;
    border-radius: 14px;
    padding: 8px;
    transition: .15s ease;
    display:flex;
    flex-direction:column;
    min-height: 236px;
  }
  .slot.over {
    border-color: var(--accent);
    background: rgba(124,183,255,.12);
    transform: scale(1.01);
  }
  .slot-body {
    min-height: 126px;
    height: 126px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .slot-fields {
    display: grid;
    gap: 8px;
    margin-top: auto;
  }
  .field label {
    display:block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    font-weight:700;
  }
  .field input {
    width: 100%;
    height: 34px;
    background: rgba(8,16,29,.9);
    border: 1px solid #4a6399;
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 16px;
    font-family: inherit;
    appearance: none;
    -webkit-appearance: none;
  }
  .field input::placeholder { color: #6d81b3; }
  .placeholder {
    width: 100%;
    font-size: 12px;
    color: #6d81b3;
    text-align: center;
    line-height: 1.5;
  }

  .bottom {
    flex: 0 0 auto;
    padding: 14px 20px 10px;
    position: sticky;
    bottom: 0;
    z-index: 20;
    background: linear-gradient(180deg, rgba(8,16,29,0.4), rgba(8,16,29,0.95) 18%, rgba(8,16,29,1));
    backdrop-filter: blur(2px);
  }
  .item-panel {
    border-top: 2px solid #4a6399;
    box-shadow: 0 -10px 20px rgba(0,0,0,.28);
  }
  .item-header {
    margin: 0 0 10px;
  }
  .item-scroll {
    overflow: auto;
    max-height: 225px;
    scrollbar-gutter: stable;
    padding-right: 6px;
  }
  .pool {
    display: grid;
    grid-template-columns: repeat(8, minmax(120px, 1fr));
    gap: 10px;
    min-width: 1060px;
  }
  .card {
    background: linear-gradient(180deg, #213154, #182440);
    border: 1px solid #47639d;
    border-radius: 14px;
    padding: 8px;
    height: 146px;
    cursor: grab;
    user-select: none;
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card.dragging {
    opacity: .45;
    transform: scale(.98);
  }
  .card.selected {
    border-color: #7fffd4;
    box-shadow: 0 0 0 3px rgba(127,255,212,.25), 0 8px 24px rgba(0,0,0,.22);
  }
  .card img {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    object-position: center center;
    border-radius: 10px;
    display: block;
    background: #0b1020;
  }
  .slot-body > .card { width: 100%; height: 100%; }
  .pool > .card { width: 100%; }

  .copyright {
    text-align: center;
    font-size: 12px;
    color: #9fb0d9;
    margin-top: 8px;
    padding: 4px 0 2px;
    opacity: 0.8;
  }

  @media (max-width: 1200px) {
    .pool {
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      min-width: 900px;
    }
    .item-scroll {
      max-height: 205px;
    }
  }
  @media (max-width: 900px) {
    .pool {
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      min-width: 620px;
    }
    .item-scroll {
      max-height: 185px;
    }
  }
</style>
</head>
<body>

<script>
(function () {
  const pass = prompt("パスワードを入力してください");
  if (pass !== "g") {
    document.documentElement.innerHTML = "<head><meta charset='UTF-8'><title>アクセス不可</title><style>body{margin:0;font-family:Arial,'Yu Gothic',Meiryo,sans-serif;background:#08101d;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh}div{padding:24px 28px;border:1px solid #31436d;border-radius:14px;background:#121a30}</style></head><body><div>アクセスできません。</div></body>";
    throw new Error("Unauthorized");
  }
})();
</script>

<div class="app">
  <div class="top">
    <div class="title-wrap">
      <h1>グループワークその１（ガンダム）　次のガンダムの機体名を答え、宇宙世紀の年代順に並べよ。</h1>
    </div>

    <section class="panel answer-panel">
      <div class="answer-header">
        <div class="answer-title">
          <h2>解答エリア</h2>
          <span class="answer-note">※形式番号はわかる範囲でOK</span>
        </div>
        <div class="answer-actions"><button id="resetBtn" type="button">リセット</button><a class="answer-link-btn" href="groupwork001_answer.html" target="_blank" rel="noopener noreferrer">解答へ</a></div>
      </div>

      <div class="answer-scroll">
        <div id="answerGrid" class="answer-groups"></div>
      </div>
    </section>
  </div>

  <div class="bottom">
    <section class="panel item-panel">
      <div class="item-header">
        <h2>機体一覧</h2>
      </div>
      <div class="item-scroll">
        <div id="pool" class="pool"></div>
      </div>
    </section>
    <footer class="copyright">© 創通・サンライズ・MBS</footer>
  </div>
</div>

<script>
const initialItems = [{"id": "g08","image": "gw01img/al.png"},{"id": "g15","image": "gw01img/xb.png"},{"id": "g07","image": "gw01img/jd.png"},{"id": "g05","image": "gw01img/t2.png"},{"id": "g19","image": "gw01img/a.png"},{"id": "g01","image": "gw01img/78.png"},{"id": "g17","image": "gw01img/gg.png"},{"id": "g18","image": "gw01img/gs.png"},{"id": "g03","image": "gw01img/ax.png"},{"id": "g14","image": "gw01img/sb.png"},{"id": "g10","image": "gw01img/bn.png"},{"id": "g11","image": "gw01img/ntc.png"},{"id": "g12","image": "gw01img/ren.png"},{"id": "g02","image": "gw01img/8z.png"},{"id": "g09","image": "gw01img/am.png"},{"id": "g04","image": "gw01img/fb.png"},{"id": "g16","image": "gw01img/us.png"},{"id": "g06","image": "gw01img/km.png"},{"id": "g20","image": "gw01img/gf.png"},{"id": "g13","image": "gw01img/hs.png"}];
const groups = [{"title": "一年戦争〜デラーズ紛争","start": 1,"end": 4,"cols": 4},{"title": "グリプス戦役〜第二次ネオ・ジオン抗争","start": 5,"end": 9,"cols": 5},{"title": "ラプラス事変〜マフティー動乱","start": 10,"end": 13,"cols": 4},{"title": "コスモ・バビロニア建国戦争〜ザンスカール戦争","start": 14,"end": 16,"cols": 3},{"title": "宇宙世紀終焉〜正暦〜R.C.","start": 17,"end": 20,"cols": 4}];

const answerGrid = document.getElementById('answerGrid');
const pool = document.getElementById('pool');
const resetBtn = document.getElementById('resetBtn');

let selectedCardId = null;

function createCard(item) {
  const card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;
  card.dataset.id = item.id;

  const img = document.createElement('img');
  img.src = item.image;
  img.alt = item.id;
  card.appendChild(img);

  card.addEventListener('dragstart', (e) => {
    card.classList.add('dragging');
    e.dataTransfer.setData('text/plain', item.id);
  });

  card.addEventListener('dragend', () => {
    card.classList.remove('dragging');
  });

  card.addEventListener('click', () => {
    document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
    if (selectedCardId === item.id) {
      selectedCardId = null;
      return;
    }
    selectedCardId = item.id;
    card.classList.add('selected');
  });

  return card;
}

function createPlaceholder() {
  const p = document.createElement('div');
  p.className = 'placeholder';
  p.innerHTML = '機体を選択<br>→ 配置先をクリック';
  return p;
}

function createSlot(index) {
  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.dataset.index = index;

  slot.innerHTML = `
    <div class="slot-body"></div>
    <div class="slot-fields">
      <div class="field">
        <label>機体名</label>
        <input type="text" placeholder="ここに入力">
      </div>
      <div class="field">
        <label>形式番号</label>
        <input type="text" placeholder="ここに入力">
      </div>
    </div>
  `;

  const body = slot.querySelector('.slot-body');
  body.appendChild(createPlaceholder());

  slot.addEventListener('dragover', (e) => {
    e.preventDefault();
    slot.classList.add('over');
  });

  slot.addEventListener('dragleave', () => {
    slot.classList.remove('over');
  });

  slot.addEventListener('drop', (e) => {
    e.preventDefault();
    slot.classList.remove('over');
    const id = e.dataTransfer.getData('text/plain');
    placeCardInSlot(id, slot);
  });

  slot.addEventListener('click', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (selectedCardId) {
      placeCardInSlot(selectedCardId, slot);
      document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
      selectedCardId = null;
    }
  });

  return slot;
}

function placeCardInSlot(cardId, slot) {
  const card = document.querySelector(`.card[data-id="${cardId}"]`);
  if (!card) return;

  const slotBody = slot.querySelector('.slot-body');
  const existingCard = slotBody.querySelector('.card');
  if (existingCard) {
    pool.appendChild(existingCard);
  }

  const currentParentSlot = card.closest('.slot');
  if (currentParentSlot) {
    const currentBody = currentParentSlot.querySelector('.slot-body');
    currentBody.innerHTML = '';
    currentBody.appendChild(createPlaceholder());
  }

  slotBody.innerHTML = '';
  slotBody.appendChild(card);
}

function buildAnswerArea() {
  answerGrid.innerHTML = '';
  groups.forEach(group => {
    const section = document.createElement('section');
    section.className = 'answer-group';

    const title = document.createElement('h3');
    title.className = 'answer-group-title';
    title.textContent = group.title;
    section.appendChild(title);

    const row = document.createElement('div');
    row.className = `answer-row cols-${group.cols}`;

    for (let i = group.start; i <= group.end; i++) {
      const wrap = document.createElement('div');
      wrap.className = 'slot-wrap';

      const no = document.createElement('div');
      no.className = 'slot-no';
      no.textContent = `【${i}】`;

      wrap.appendChild(no);
      wrap.appendChild(createSlot(i - 1));
      row.appendChild(wrap);
    }

    section.appendChild(row);
    answerGrid.appendChild(section);
  });
}

function resetAll() {
  answerGrid.querySelectorAll('.slot').forEach(slot => {
    const body = slot.querySelector('.slot-body');
    const card = body.querySelector('.card');
    if (card) pool.appendChild(card);
    body.innerHTML = '';
    body.appendChild(createPlaceholder());
  });
  answerGrid.querySelectorAll('input').forEach(input => input.value = '');
  document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
  selectedCardId = null;
}

function shufflePool() {
  const cards = Array.from(pool.children);
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  cards.forEach(card => pool.appendChild(card));
}

buildAnswerArea();
initialItems.forEach(item => {
  pool.appendChild(createCard(item));
});
shufflePool();
resetBtn.addEventListener('click', resetAll);
</script>
</body>
</html>
