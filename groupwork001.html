<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>グループワークその１</title>
<style>
  :root{
    --bg:#07101f;
    --panel:#0f1b31;
    --panel2:#142544;
    --line:#2d4f80;
    --line2:#4f90d8;
    --text:#eaf3ff;
    --muted:#9fb4d7;
    --accent:#62b0ff;
    --gold:#ffd166;
    --green:#6ee7b7;
    --danger:#ff6b6b;
  }

  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;
    font-family:Arial, "Helvetica Neue", Helvetica, "Yu Gothic", "Yu Gothic UI", Meiryo, sans-serif;
    line-height:1.5;
    color:var(--text);
    background:
      linear-gradient(rgba(98,176,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(98,176,255,.035) 1px, transparent 1px),
      radial-gradient(circle at 15% 10%, rgba(98,176,255,.18), transparent 26%),
      linear-gradient(180deg,#07101f,#101a31 55%,#08101d);
    background-size:42px 42px,42px 42px,auto,auto;
  }

  .app{
    max-width:1440px;
    margin:0 auto;
    padding:18px 20px 44px;
  }

  .header{
    position:sticky;
    top:0;
    z-index:50;
    margin:-18px -20px 18px;
    padding:16px 20px;
    background:linear-gradient(180deg, rgba(7,16,31,.98), rgba(7,16,31,.90));
    backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(98,176,255,.25);
  }

  .header-inner{
    max-width:1440px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
  }

  h1{
    margin:0;
    font-size:clamp(22px, 3vw, 34px);
    letter-spacing:.02em;
  }


  .actions{
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
    flex:0 0 auto;
  }

  button,.answer-link-btn{
    border:1px solid rgba(98,176,255,.55);
    border-radius:14px;
    padding:12px 18px;
    background:linear-gradient(180deg, rgba(98,176,255,.22), rgba(98,176,255,.08));
    color:var(--text);
    font-weight:900;
    font-family:inherit;
    font-size:15px;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:46px;
  }

  button:hover,.answer-link-btn:hover{
    filter:brightness(1.12);
    box-shadow:0 0 20px rgba(98,176,255,.18);
  }

  .answer-link-btn{
    background:linear-gradient(180deg, #2d83ff, #1e5fd0);
    border-color:#62b0ff;
    color:#fff;
  }

  .layout{
    display:grid;
    grid-template-columns:minmax(360px, 440px) 1fr;
    gap:20px;
    align-items:start;
  }

  .panel{
    background:rgba(15,27,49,.92);
    border:1px solid rgba(98,176,255,.28);
    border-radius:22px;
    box-shadow:0 14px 34px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.03);
  }

  .pool-panel{
    position:sticky;
    top:98px;
    max-height:calc(100vh - 118px);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .panel-head{
    padding:18px 18px 12px;
    border-bottom:1px solid rgba(98,176,255,.20);
  }

  .panel-title{
    margin:0;
    font-size:20px;
  }

  .panel-note{
    margin:5px 0 0;
    color:var(--muted);
    font-size:13px;
  }

  .selected-status{
    margin-top:10px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px solid rgba(110,231,183,.35);
    background:rgba(110,231,183,.08);
    color:#bfffe8;
    border-radius:999px;
    padding:6px 10px;
    font-size:12px;
    font-weight:800;
  }

  .pool-scroll{
    overflow:auto;
    padding:16px;
  }

  .pool{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:14px;
  }

  .card{
    background:linear-gradient(180deg, rgba(20,37,68,.92), rgba(12,23,42,.96));
    border:2px solid rgba(98,176,255,.24);
    border-radius:16px;
    padding:8px;
    min-height:154px;
    cursor:grab;
    user-select:none;
    box-shadow:0 8px 18px rgba(0,0,0,.22);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .card:active{cursor:grabbing}
  .card.dragging{opacity:.45; transform:scale(.98)}
  .card.selected{
    border-color:var(--gold);
    box-shadow:0 0 0 4px rgba(255,209,102,.26), 0 10px 24px rgba(0,0,0,.28);
  }

  .card img{
    width:100%;
    height:100%;
    max-height:150px;
    object-fit:contain;
    display:block;
    border-radius:10px;
    background:transparent;
  }

  .answer-panel{
    padding:18px;
    overflow:visible;
  }

  .answer-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    margin-bottom:16px;
  }

  .answer-header h2{
    margin:0;
    font-size:24px;
  }

  .answer-header p{
    margin:5px 0 0;
    color:var(--muted);
    font-size:13px;
  }

  .legend{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
    color:var(--muted);
    font-size:12px;
  }

  .legend span{
    border:1px solid rgba(98,176,255,.24);
    background:rgba(98,176,255,.06);
    border-radius:999px;
    padding:6px 9px;
  }

  .answer-group{
    border:1px solid rgba(98,176,255,.24);
    border-radius:20px;
    overflow:visible;
    margin-bottom:18px;
    background:rgba(8,16,31,.36);
  }

  .answer-group-title{
    margin:0;
    padding:12px 16px;
    font-size:17px;
    letter-spacing:.02em;
    background:linear-gradient(90deg, rgba(98,176,255,.24), rgba(98,176,255,.05));
    border-bottom:1px solid rgba(98,176,255,.20);
  }

  .answer-row{
    display:grid;
    gap:14px;
    padding:16px;
  }

  .answer-row.cols-3{grid-template-columns:repeat(3, minmax(0,1fr))}
  .answer-row.cols-4{grid-template-columns:repeat(4, minmax(0,1fr))}
  .answer-row.cols-5{grid-template-columns:repeat(5, minmax(0,1fr))}

  .slot-wrap{
    min-width:0;
  }

  .slot-no{
    color:#d9e9ff;
    font-weight:900;
    font-size:15px;
    margin-bottom:8px;
    letter-spacing:.04em;
  }

  .slot{
    min-height:258px;
    background:linear-gradient(180deg, rgba(20,37,68,.82), rgba(12,23,42,.92));
    border:2px dashed rgba(98,176,255,.34);
    border-radius:18px;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:.15s ease;
  }

  .slot.over{
    border-color:var(--gold);
    background:rgba(255,209,102,.08);
    box-shadow:0 0 0 4px rgba(255,209,102,.13);
  }

  .slot-body{
    height:154px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-radius:14px;
    background:rgba(255,255,255,.035);
  }

  .slot-body .card{
    width:100%;
    height:100%;
    min-height:0;
    box-shadow:none;
    padding:6px;
  }

  .placeholder{
    width:100%;
    text-align:center;
    color:#b7c7e5;
    font-size:13px;
    font-weight:800;
    line-height:1.7;
    padding:12px;
  }

  .slot-fields{
    display:grid;
    gap:8px;
    margin-top:auto;
  }

  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:4px;
    font-weight:800;
  }

  .field input{
    width:100%;
    height:38px;
    border:1px solid rgba(98,176,255,.28);
    border-radius:10px;
    background:rgba(255,255,255,.95);
    color:#152033;
    padding:8px 10px;
    font-family:inherit;
    font-size:14px;
  }

  .field input::placeholder{color:#75849b}

  .hint{
    margin:22px 0 0;
    color:var(--muted);
    font-size:12px;
    text-align:center;
  }


  .slot-label-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }

  .hint-wrap{
    position:relative;
    display:inline-flex;
    align-items:center;
  }

  .hint-btn{
    width:26px;
    height:26px;
    min-height:0;
    padding:0;
    border-radius:50%;
    border:2px solid rgba(98,176,255,.58);
    background:#f4f8ff;
    color:#0f1b31;
    font-weight:900;
    font-size:16px;
    line-height:1;
    box-shadow:0 3px 8px rgba(0,0,0,.20);
  }

  .hint-popover{
    display:none;
    position:fixed;
    width:min(460px, calc(100vw - 32px));
    max-height:min(360px, calc(100vh - 32px));
    overflow:auto;
    z-index:9999;
    padding:14px 40px 14px 16px;
    border:2px solid var(--gold);
    border-radius:14px;
    background:#fff9e8;
    color:#7a2f14;
    box-shadow:0 14px 34px rgba(0,0,0,.34);
    font-size:14px;
    line-height:1.7;
  }

  .hint-popover.show{
    display:block;
  }

  .hint-title{
    font-weight:900;
    font-size:15px;
    margin-bottom:6px;
  }

  .hint-close{
    position:absolute;
    right:10px;
    top:8px;
    border:0;
    background:transparent;
    color:#7a2f14;
    width:24px;
    height:24px;
    min-height:0;
    padding:0;
    font-size:22px;
    line-height:1;
    box-shadow:none;
  }

  @media (max-width:1180px){
    .layout{
      grid-template-columns:1fr;
    }
    .pool-panel{
      position:static;
      max-height:none;
    }
    .pool{
      grid-template-columns:repeat(4, minmax(130px, 1fr));
    }
    .answer-row.cols-5,
    .answer-row.cols-4{
      grid-template-columns:repeat(3, minmax(0,1fr));
    }
  }

  @media (max-width:760px){
    .header-inner{
      align-items:flex-start;
      flex-direction:column;
    }
    .actions{
      width:100%;
    }
    button,.answer-link-btn{
      flex:1;
    }
    .pool{
      grid-template-columns:repeat(2, minmax(0,1fr));
    }
    .answer-row.cols-5,
    .answer-row.cols-4,
    .answer-row.cols-3{
      grid-template-columns:1fr;
    }
    .slot{
      min-height:238px;
    }
  }
</style>
</head>

<body>
<script>
(function () {
  const pass = prompt("パスワードを入力してください");
  if (pass !== "g") {
    document.documentElement.innerHTML =
      "<head><meta charset='UTF-8'><title>アクセス不可</title><style>body{margin:0;font-family:Arial,'Yu Gothic',Meiryo,sans-serif;background:#08101d;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh}div{padding:24px 28px;border:1px solid #31436d;border-radius:14px;background:#121a30}</style></head><body><div>アクセスできません。</div></body>";
    throw new Error("Unauthorized");
  }
})();
</script>

<div class="app">
  <header class="header">
    <div class="header-inner">
      <div>
        <h1>ガンダム機体名を答え、宇宙世紀の年代順に並べよ</h1>
              </div>
      <div class="actions">
        <button id="resetBtn" type="button">リセット</button>
        <a class="answer-link-btn" href="groupwork001_answer.html" target="_blank" rel="noopener">解答へ</a>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="panel pool-panel">
      <div class="panel-head">
        <h2 class="panel-title">機体画像一覧</h2>
        <p class="panel-note">クリックで選択 → 右側の配置先をクリックして配置できます。</p>
        <div class="selected-status" id="selectedStatus">未選択</div>
      </div>
      <div class="pool-scroll">
        <div class="pool" id="pool"></div>
      </div>
    </section>

    <section class="panel answer-panel">
      <div class="answer-header">
        <div>
          <h2>年代順に並べる</h2>
                  </div>
        <div class="legend">
          <span>クリック配置対応</span>
          <span>ドラッグ対応</span>
          <span>縦スクロール対応</span>
        </div>
      </div>

      <div id="answerGrid"></div>
      <p class="hint">※ 配置済みの画像同士をドラッグすると、入れ替えることができます。</p>
    </section>
  </main>
</div>

<script>
const initialItems = [
  {id:"g08", image:"gw01img/al.png"},
  {id:"g15", image:"gw01img/xb.png"},
  {id:"g07", image:"gw01img/jd.png"},
  {id:"g05", image:"gw01img/t2.png"},
  {id:"g19", image:"gw01img/a.png"},
  {id:"g01", image:"gw01img/78.png"},
  {id:"g17", image:"gw01img/gg.png"},
  {id:"g18", image:"gw01img/gs.png"},
  {id:"g03", image:"gw01img/ax.png"},
  {id:"g14", image:"gw01img/sb.png"},
  {id:"g10", image:"gw01img/bn.png"},
  {id:"g11", image:"gw01img/ntc.png"},
  {id:"g12", image:"gw01img/ren.png"},
  {id:"g02", image:"gw01img/8z.png"},
  {id:"g09", image:"gw01img/am.png"},
  {id:"g04", image:"gw01img/fb.png"},
  {id:"g16", image:"gw01img/us.png"},
  {id:"g06", image:"gw01img/km.png"},
  {id:"g20", image:"gw01img/gf.png"},
  {id:"g13", image:"gw01img/hs.png"}
];

const groups = [
  {title:"一年戦争〜デラーズ紛争", start:1, end:4, cols:4},
  {title:"グリプス戦役〜第二次ネオ・ジオン抗争", start:5, end:9, cols:5},
  {title:"ラプラス事変〜マフティー動乱", start:10, end:13, cols:4},
  {title:"コスモ・バビロニア建国戦争〜ザンスカール戦争", start:14, end:16, cols:3},
  {title:"宇宙世紀終焉〜正暦〜R.C.", start:17, end:20, cols:4}
];

const hints = {
  "1": "アムロ・レイの最初の搭乗機。<br>地球連邦軍のV作戦によって製造されたモビルスーツ。<br>ジオン軍からは「白い悪魔」と呼ばれ恐れられた。<br>ジークアクスではなんかでかくなった。<br>横浜の動くガンダム見たかった・・・。",
  "2": "シロー・アマダの搭乗機。<br>陸戦型ガンダム等のパーツを現地で改修した特別指揮官機。<br>モビルスーツ量産計画の初期に製造されており、こと地上戦においてはガンダムにも匹敵する性能。<br>ノリスのグフカスタムとの一騎打ちは胸が熱くなる。<br>嵐の中で輝くガンダムでテンイヤーズアフター。",
  "3": "クリスチーナ・マッケンジーの搭乗機。<br>ニュータイプに覚醒したアムロだが、反面ガンダム自体がアムロの操作反応に追いつけなくなってきていた。<br>そのため、連邦軍はアムロが登場することを前提としたニュータイプ専用機を開発。<br>リボー・コロニーでテストされていたが、サイクロプス隊の襲撃によりアムロの手に渡ることはなかった。<br>クリスマスの時期に観ると鬱になるガンダム。嘘だと言ってよバーニィ。",
  "4": "コウ・ウラキの搭乗機。<br>ガンダム開発計画で製造された試作機3機のうちの1機。<br>汎用型であったが、アナベル・ガトーによって強奪されたGP02サイサリスを追う過程で、シーマ・ガラハウによって大破し、宇宙での活動に最適化したフルバーニアンタイプに改修された。<br>ニンジンいらないよ→この海は…地獄だ！",
  "5": "カミーユ・ビダンの最初の搭乗機。<br>ティターンズがフラグシップ機として開発した黒っぽいガンダム。<br>エゥーゴが奪取したあとはいつものトリコロールカラーに塗り替えられた。<br>ガンダムの中でも一番多搭乗者が多いガンダム。<br>強奪後に笑いながらティターンズの人たちを踏み潰そうとするカミーユのアレっぷりは今でもドン引きレベル。",
  "6": "カミーユ・ビダンの搭乗機。<br>Z計画によって開発されたエゥーゴの可変モビルスーツ。<br>ムーバブルフレーム＆ガンダリムγの性能とカミーユのニュータイプ能力も相まって最強クラスのガンダムに。<br>ゲームでは最強クラスだがアニメでは結構苦戦してた場面も多い。<br>差し替えなしで完全変形でき、かつMS形態もWR形態も最適なプロポーションを保つことができるか？がガンプラにおける永遠のテーマになっているガンダム。",
  "7": "ジュドー・アーシタの搭乗機。<br>Z計画によって開発されたガンダムの1機。<br>コードネームはθ(シータ)ガンダム。<br>実はZガンダムより開発は先。<br>3機による合体変形ガンダムであり、スパロボ味がある。<br>というかビルドファイターズトライではスパロボになってしまった。<br>メインカメラの直上にハイメガ粒子砲があるのは、どう考えても設計ミスではないのか？と思わざるを得ないガンダム。",
  "8": "リョウ・ルーツの搭乗機。<br>Z計画によって開発されたガンダムの1機。<br>コードネームは ι(イオタ)ガンダム。<br>究極のガンダムを目指して製造された。<br>メインコンピュータには「ALICE」というAI搭載している。<br>映像化されてないが、ファンが非常に多いガンダム。<br>ガンプラ再販の際は争奪戦になる。<br>色々な意味で、多くの人にトラウマを植え付けたガンダムでもある。",
  "9": "アムロ・レイの最後の搭乗機。<br>ロンド・ベルのフラグシップ機。<br>背面のフィン・ファンネルが特徴的なニュータイプ専用機。<br>シャアから提供されたサイコフレームによって完成をみた。<br>ららぽーと福岡のガンダムはこのガンダム。<br>（色はららぽーと福岡専用色ではあるが）<br>パトレイバーやダンバインでも有名な出渕裕氏がデザイン。 <br>閃光のハサウェイでは量産型が、ゴリゴリとハサウェイのトラウマを抉る演出に観客ドン引きだった。",
  "10": "バジーナ・リンクスの搭乗機。<br>UC計画によって開発された試作型モビルスーツ。<br>全身をサイコフレームで構成されているニュータイプ専用機。<br>モード変化によって変身するガンダム。<br>多少オカルトチック。<br>パチスロで有名になってしまい、あちこちでミーム化もされてしまった悲しいガンダム。",
  "11": "ヨナ・バシュタの搭乗機。<br>サイコフレームの試作機として開発されたガンダム。<br>νガンダムより先に開発されている（らしい）。<br>単体では戦闘能力はほぼなく、様々な武装ユニットを接続して戦う拡張性の高いガンダム。<br>どうしてもフェネクスの方が（金色だし）目立ってしまっていて、主人公機だと認識があまりされてない悲しいガンダム。",

const answerGrid = document.getElementById("answerGrid");
const pool = document.getElementById("pool");
const resetBtn = document.getElementById("resetBtn");
const selectedStatus = document.getElementById("selectedStatus");
let selectedCardId = null;

function updateSelectedStatus(){
  selectedStatus.textContent = selectedCardId ? "画像を選択中" : "未選択";
}

function createCard(item){
  const card = document.createElement("div");
  card.className = "card";
  card.draggable = true;
  card.dataset.id = item.id;

  const img = document.createElement("img");
  img.src = item.image;
  img.alt = item.id;
  card.appendChild(img);

  card.addEventListener("dragstart", e => {
    card.classList.add("dragging");
    e.dataTransfer.setData("text/plain", item.id);
  });

  card.addEventListener("dragend", () => {
    card.classList.remove("dragging");
  });

  card.addEventListener("click", e => {
    e.stopPropagation();
    document.querySelectorAll(".card.selected").forEach(el => el.classList.remove("selected"));
    if(selectedCardId === item.id){
      selectedCardId = null;
      updateSelectedStatus();
      return;
    }
    selectedCardId = item.id;
    card.classList.add("selected");
    updateSelectedStatus();
  });

  return card;
}

function createPlaceholder(){
  const p = document.createElement("div");
  p.className = "placeholder";
  p.innerHTML = "画像を選択<br>またはドラッグ";
  return p;
}

function createSlot(index){
  const slot = document.createElement("div");
  slot.className = "slot";
  slot.dataset.index = index;

  slot.innerHTML = `
    <div class="slot-body"></div>
    <div class="slot-fields">
      <div class="field">
        <label>機体名</label>
        <input type="text" placeholder="機体名を入力">
      </div>
    </div>
  `;

  const body = slot.querySelector(".slot-body");
  body.appendChild(createPlaceholder());

  slot.addEventListener("dragover", e => {
    e.preventDefault();
    slot.classList.add("over");
  });

  slot.addEventListener("dragleave", () => {
    slot.classList.remove("over");
  });

  slot.addEventListener("drop", e => {
    e.preventDefault();
    slot.classList.remove("over");
    const id = e.dataTransfer.getData("text/plain");
    placeCardInSlot(id, slot);
  });

  slot.addEventListener("click", e => {
    if(e.target.tagName === "INPUT") return;
    if(selectedCardId){
      placeCardInSlot(selectedCardId, slot);
      document.querySelectorAll(".card.selected").forEach(el => el.classList.remove("selected"));
      selectedCardId = null;
      updateSelectedStatus();
    }
  });

  return slot;
}

function placeCardInSlot(cardId, slot){
  const card = document.querySelector(`.card[data-id="${cardId}"]`);
  if(!card) return;

  const targetBody = slot.querySelector(".slot-body");
  const existingCard = targetBody.querySelector(".card");
  const currentParentSlot = card.closest(".slot");
  const currentBody = currentParentSlot ? currentParentSlot.querySelector(".slot-body") : null;

  // 同じ欄に置こうとした場合は何もしない
  if(existingCard === card) return;

  // 配置済みカード同士の場合は入れ替え
  if(existingCard && currentBody){
    targetBody.innerHTML = "";
    targetBody.appendChild(card);

    currentBody.innerHTML = "";
    currentBody.appendChild(existingCard);
    return;
  }

  // 一覧から配置済み欄へ置く場合、既存カードは一覧へ戻す
  if(existingCard){
    pool.appendChild(existingCard);
  }

  // 配置済みカードを空欄へ移動する場合、元の欄は空欄表示へ戻す
  if(currentBody){
    currentBody.innerHTML = "";
    currentBody.appendChild(createPlaceholder());
  }

  targetBody.innerHTML = "";
  targetBody.appendChild(card);
}


function clamp(value, min, max){
  return Math.min(Math.max(value, min), max);
}

function positionHint(button, popover){
  const margin = 16;
  const rect = button.getBoundingClientRect();
  popover.classList.add("show");

  const width = Math.min(460, window.innerWidth - margin * 2);
  popover.style.width = width + "px";

  const popRect = popover.getBoundingClientRect();
  let left = rect.left - 42;
  left = clamp(left, margin, window.innerWidth - popRect.width - margin);

  let top = rect.bottom + 10;
  if(top + popRect.height > window.innerHeight - margin){
    top = rect.top - popRect.height - 10;
  }
  top = clamp(top, margin, window.innerHeight - popRect.height - margin);

  popover.style.left = left + "px";
  popover.style.top = top + "px";
}

function buildAnswerArea(){
  answerGrid.innerHTML = "";
  groups.forEach(group => {
    const section = document.createElement("section");
    section.className = "answer-group";

    const title = document.createElement("h3");
    title.className = "answer-group-title";
    title.textContent = group.title;
    section.appendChild(title);

    const row = document.createElement("div");
    row.className = `answer-row cols-${group.cols}`;

    for(let i = group.start; i <= group.end; i++){
      const wrap = document.createElement("div");
      wrap.className = "slot-wrap";

      const labelRow = document.createElement("div");
      labelRow.className = "slot-label-row";

      const no = document.createElement("div");
      no.className = "slot-no";
      no.textContent = `【${i}】`;
      labelRow.appendChild(no);

      let hintBox = null;
      if(hints[String(i)]){
        const hintWrap = document.createElement("span");
        hintWrap.className = "hint-wrap";

        const hintBtn = document.createElement("button");
        hintBtn.type = "button";
        hintBtn.className = "hint-btn";
        hintBtn.textContent = "?";
        hintBtn.setAttribute("aria-label", "ヒントを表示");

        hintBox = document.createElement("div");
        hintBox.className = "hint-popover";
        hintBox.innerHTML = `
          <button type="button" class="hint-close" aria-label="ヒントを閉じる">×</button>
          <div class="hint-title">【${i}】のヒント：</div>
          <div>${hints[String(i)]}</div>
        `;

        hintBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          const wasOpen = hintBox.classList.contains("show");
          document.querySelectorAll(".hint-popover.show").forEach(el => {
            if(el !== hintBox) el.classList.remove("show");
          });
          if(wasOpen){
            hintBox.classList.remove("show");
          }else{
            positionHint(hintBtn, hintBox);
          }
        });

        hintBox.querySelector(".hint-close").addEventListener("click", (e) => {
          e.stopPropagation();
          hintBox.classList.remove("show");
        });

        hintWrap.appendChild(hintBtn);
        hintWrap.appendChild(hintBox);
        labelRow.appendChild(hintWrap);
      }

      wrap.appendChild(labelRow);
      wrap.appendChild(createSlot(i - 1));
      row.appendChild(wrap);
    }

    section.appendChild(row);
    answerGrid.appendChild(section);
  });
}

function resetAll(){
  answerGrid.querySelectorAll(".slot").forEach(slot => {
    const body = slot.querySelector(".slot-body");
    const card = body.querySelector(".card");
    if(card) pool.appendChild(card);
    body.innerHTML = "";
    body.appendChild(createPlaceholder());
  });
  answerGrid.querySelectorAll("input").forEach(input => input.value = "");
  document.querySelectorAll(".card.selected").forEach(el => el.classList.remove("selected"));
  selectedCardId = null;
  updateSelectedStatus();
  shufflePool();
}

function shufflePool(){
  const cards = Array.from(pool.children);
  for(let i = cards.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  cards.forEach(card => pool.appendChild(card));
}

buildAnswerArea();
initialItems.forEach(item => pool.appendChild(createCard(item)));
shufflePool();
updateSelectedStatus();
resetBtn.addEventListener("click", resetAll);
document.addEventListener("click", () => {
  document.querySelectorAll(".hint-popover.show").forEach(el => el.classList.remove("show"));
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    document.querySelectorAll(".hint-popover.show").forEach(el => el.classList.remove("show"));
  }
});
window.addEventListener("resize", () => {
  document.querySelectorAll(".hint-popover.show").forEach(el => el.classList.remove("show"));
});
window.addEventListener("scroll", () => {
  document.querySelectorAll(".hint-popover.show").forEach(el => el.classList.remove("show"));
}, true);
</script>
