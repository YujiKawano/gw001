<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>グループワークその３</title>
<style>
  :root{
    --text:#67315f;
    --muted:#a45d96;
    --panel:rgba(255,255,255,.88);
    --panel2:rgba(255,245,252,.94);
    --line:#f5a3d3;
    --line2:#ffd166;
    --accent:#ff6fbd;
    --blue:#7edcff;
    --green:#68d8b6;
  }

  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;
    font-family:Arial, "Helvetica Neue", Helvetica, "Yu Gothic", "Yu Gothic UI", Meiryo, sans-serif;
    line-height:1.5;
    color:var(--text);
    background:
      radial-gradient(circle at 14% 12%, rgba(255,255,255,.95) 0 2%, transparent 5%),
      radial-gradient(circle at 88% 10%, rgba(255,255,255,.92) 0 2%, transparent 5%),
      radial-gradient(circle at 20% 8%, #fff4b8 0 8%, transparent 25%),
      radial-gradient(circle at 84% 14%, #c9f4ff 0 7%, transparent 24%),
      radial-gradient(circle at 50% 100%, #ffe2f3 0 22%, transparent 48%),
      linear-gradient(135deg,#ffe0f2 0%, #fff8cf 46%, #dff8ff 100%);
    background-attachment:fixed;
  }

  body::before{
    content:"♡ ★ ✦ ♡ ★ ✦ ♡ ★";
    position:fixed;
    inset:10px 0 auto 0;
    text-align:center;
    font-size:22px;
    letter-spacing:20px;
    color:rgba(255,105,180,.24);
    pointer-events:none;
    z-index:0;
  }

  .app{
    position:relative;
    z-index:1;
    max-width:1440px;
    margin:0 auto;
    padding:18px 20px 44px;
  }

  .header{
    position:sticky;
    top:0;
    z-index:50;
    margin:-18px -20px 18px;
    padding:16px 20px;
    background:
      radial-gradient(circle at 12% 40%, rgba(255,111,189,.18), transparent 34%),
      linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,245,252,.92));
    backdrop-filter:blur(8px);
    border-bottom:2px solid rgba(245,163,211,.72);
    box-shadow:0 10px 24px rgba(204,78,158,.14);
  }

  .header-inner{
    max-width:1440px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
  }

  h1{
    margin:0;
    font-size:clamp(22px, 3vw, 34px);
    color:#7b2f72;
    letter-spacing:.02em;
    text-shadow:0 2px 0 rgba(255,255,255,.85);
  }

  .actions{
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
    flex:0 0 auto;
  }

  button,.answer-link-btn{
    border:2px solid rgba(245,163,211,.92);
    border-radius:999px;
    padding:12px 20px;
    background:linear-gradient(180deg,#fff,#fff0fa);
    color:var(--text);
    font-weight:900;
    font-family:inherit;
    font-size:15px;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:46px;
    box-shadow:0 5px 14px rgba(255,111,189,.18);
  }

  button:hover,.answer-link-btn:hover{
    filter:brightness(1.04);
    transform:translateY(-1px);
  }

  .answer-link-btn{
    background:linear-gradient(90deg,#ff6fbd,#ff9bd4,#ffd166);
    border-color:#ff7bc8;
    color:#fff;
    text-shadow:0 1px 1px rgba(128,35,104,.34);
  }

  .layout{
    display:grid;
    grid-template-columns:minmax(360px, 440px) 1fr;
    gap:20px;
    align-items:start;
  }

  .panel{
    background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,245,252,.90));
    border:2px solid rgba(245,163,211,.82);
    border-radius:24px;
    box-shadow:0 14px 34px rgba(204,78,158,.16), inset 0 0 0 2px rgba(255,255,255,.62);
  }

  .pool-panel{
    position:sticky;
    top:98px;
    max-height:calc(100vh - 118px);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .panel-head{
    padding:18px 18px 12px;
    border-bottom:2px solid rgba(245,163,211,.45);
  }

  .panel-title{
    margin:0;
    font-size:20px;
    color:#7b2f72;
  }

  .panel-note{
    margin:5px 0 0;
    color:var(--muted);
    font-size:13px;
  }

  .selected-status{
    margin-top:10px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px solid rgba(104,216,182,.50);
    background:rgba(104,216,182,.12);
    color:#28705c;
    border-radius:999px;
    padding:6px 10px;
    font-size:12px;
    font-weight:900;
  }

  .pool-scroll{
    overflow:auto;
    padding:16px;
  }

  .pool{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:14px;
  }

  .card{
    background:linear-gradient(180deg,#fff,#fff6fb);
    border:2px solid rgba(245,163,211,.68);
    border-radius:18px;
    padding:8px;
    min-height:154px;
    cursor:grab;
    user-select:none;
    box-shadow:0 8px 18px rgba(204,78,158,.14);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .card:active{cursor:grabbing}
  .card.dragging{opacity:.45; transform:scale(.98)}
  .card.selected{
    border-color:#ffd166;
    box-shadow:0 0 0 4px rgba(255,209,102,.30), 0 10px 24px rgba(204,78,158,.18);
  }

  .card img{
    width:100%;
    height:100%;
    max-height:150px;
    object-fit:contain;
    display:block;
    border-radius:12px;
    background:transparent;
  }

  .answer-panel{
    padding:18px;
  }

  .answer-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    margin-bottom:16px;
  }

  .answer-header h2{
    margin:0;
    font-size:24px;
    color:#7b2f72;
  }

  .legend{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
    color:var(--muted);
    font-size:12px;
  }

  .legend span{
    border:1px solid rgba(245,163,211,.50);
    background:rgba(255,255,255,.55);
    border-radius:999px;
    padding:6px 9px;
    font-weight:800;
  }

  .answer-group{
    border:2px solid rgba(245,163,211,.55);
    border-radius:22px;
    overflow:hidden;
    margin-bottom:18px;
    background:rgba(255,255,255,.48);
  }

  .answer-group-title{
    margin:0;
    padding:12px 16px;
    font-size:17px;
    color:#7b2f72;
    letter-spacing:.02em;
    background:linear-gradient(90deg, rgba(255,111,189,.22), rgba(255,209,102,.18), rgba(126,220,255,.12));
    border-bottom:2px solid rgba(245,163,211,.36);
  }

  .answer-row{
    display:grid;
    grid-template-columns:repeat(5, minmax(0,1fr));
    gap:14px;
    padding:16px;
  }

  .slot-wrap{min-width:0}

  .slot-no{
    color:#d94ca8;
    font-weight:900;
    font-size:15px;
    margin-bottom:8px;
    letter-spacing:.04em;
  }

  .slot{
    min-height:238px;
    background:linear-gradient(180deg, rgba(255,255,255,.74), rgba(255,241,250,.86));
    border:2px dashed rgba(245,163,211,.88);
    border-radius:18px;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:.15s ease;
  }

  .slot.over{
    border-color:#ff6fbd;
    background:rgba(255,238,248,.96);
    box-shadow:0 0 0 4px rgba(255,111,189,.16);
  }

  .slot-body{
    height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-radius:14px;
    background:rgba(255,255,255,.50);
  }

  .slot-body .card{
    width:100%;
    height:100%;
    min-height:0;
    box-shadow:none;
    padding:6px;
  }

  .placeholder{
    width:100%;
    text-align:center;
    color:#b66ca7;
    font-size:13px;
    font-weight:900;
    line-height:1.7;
    padding:12px;
  }

  .slot-fields{
    display:grid;
    gap:8px;
    margin-top:auto;
  }

  .field input{
    width:100%;
    height:40px;
    border:1px solid rgba(245,163,211,.65);
    border-radius:999px;
    background:rgba(255,255,255,.96);
    color:#65325f;
    padding:8px 12px;
    font-family:inherit;
    font-size:14px;
    box-shadow:inset 0 1px 2px rgba(200,70,150,.08);
  }

  .field input::placeholder{color:#c88abc}

  .hint{
    margin:22px 0 0;
    color:var(--muted);
    font-size:12px;
    text-align:center;
    font-weight:800;
  }

  @media (max-width:1180px){
    .layout{grid-template-columns:1fr}
    .pool-panel{position:static; max-height:none}
    .pool{grid-template-columns:repeat(4, minmax(130px,1fr))}
    .answer-row{grid-template-columns:repeat(4, minmax(0,1fr))}
  }

  @media (max-width:760px){
    .header-inner{align-items:flex-start; flex-direction:column}
    .actions{width:100%}
    button,.answer-link-btn{flex:1}
    .pool{grid-template-columns:repeat(2, minmax(0,1fr))}
    .answer-row{grid-template-columns:1fr}
    .slot{min-height:230px}
  }
</style>
</head>

<body>
<script>
(function () {
  const pass = prompt("パスワードを入力してください");
  if (pass !== "max") {
    document.documentElement.innerHTML =
      "<head><meta charset='UTF-8'><title>アクセス不可</title><style>body{margin:0;font-family:Arial,'Yu Gothic',Meiryo,sans-serif;background:linear-gradient(135deg,#ffe0f2,#fff8cf,#dff8ff);color:#65325f;display:flex;align-items:center;justify-content:center;height:100vh}div{padding:24px 28px;border:2px solid #f5a3d3;border-radius:18px;background:rgba(255,255,255,.88);font-weight:900}</style></head><body><div>アクセスできません。</div></body>";
    throw new Error("Unauthorized");
  }
})();
</script>

<div class="app">
  <header class="header">
    <div class="header-inner">
      <div>
        <h1>プリキュアを年代順に並べよ</h1>
      </div>
      <div class="actions">
        <button id="resetBtn" type="button">リセット</button>
        <a class="answer-link-btn" href="groupwork003_answer.html" target="_blank" rel="noopener">解答へ</a>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="panel pool-panel">
      <div class="panel-head">
        <h2 class="panel-title">プリキュア画像一覧</h2>
        <p class="panel-note">クリックで選択 → 右側の配置先をクリックして配置できます。</p>
        <div class="selected-status" id="selectedStatus">未選択</div>
      </div>
      <div class="pool-scroll">
        <div class="pool" id="pool"></div>
      </div>
    </section>

    <section class="panel answer-panel">
      <div class="answer-header">
        <div>
          <h2>シリーズ順に並べる</h2>
        </div>
        <div class="legend">
          <span>クリック配置対応</span>
          <span>ドラッグ対応</span>
          <span>入れ替え対応</span>
        </div>
      </div>

      <div id="answerGrid"></div>
      <p class="hint">※ 配置済みの画像同士をドラッグすると、入れ替えることができます。</p>
    </section>
  </main>
</div>

<script>
const initialItems = [{"id": "p01", "image": "gw03img/nagisa.png"}, {"id": "p02", "image": "gw03img/mnagisa.png"}, {"id": "p03", "image": "gw03img/saki.png"}, {"id": "p04", "image": "gw03img/nozomi.png"}, {"id": "p05", "image": "gw03img/ynozomi.png"}, {"id": "p06", "image": "gw03img/love.png"}, {"id": "p07", "image": "gw03img/tsubomi.png"}, {"id": "p08", "image": "gw03img/hibiki.png"}, {"id": "p09", "image": "gw03img/miyuki.png"}, {"id": "p10", "image": "gw03img/ayumi.png"}, {"id": "p11", "image": "gw03img/mana.png"}, {"id": "p12", "image": "gw03img/megumi.png"}, {"id": "p13", "image": "gw03img/haruka.png"}, {"id": "p14", "image": "gw03img/mirai.png"}, {"id": "p15", "image": "gw03img/ichika.png"}, {"id": "p16", "image": "gw03img/hana.png"}, {"id": "p17", "image": "gw03img/hikaru.png"}, {"id": "p18", "image": "gw03img/nodoka.png"}, {"id": "p19", "image": "gw03img/manatsu.png"}, {"id": "p20", "image": "gw03img/yui.png"}, {"id": "p21", "image": "gw03img/sora.png"}, {"id": "p22", "image": "gw03img/komugi.png"}, {"id": "p23", "image": "gw03img/uta.png"}, {"id": "p24", "image": "gw03img/annna.png"}];

const groups = [
  {title:"プリキュア年代順", start:1, end:24, cols:6}
];

const answerGrid = document.getElementById("answerGrid");
const pool = document.getElementById("pool");
const resetBtn = document.getElementById("resetBtn");
const selectedStatus = document.getElementById("selectedStatus");
let selectedCardId = null;

function updateSelectedStatus(){
  selectedStatus.textContent = selectedCardId ? "画像を選択中" : "未選択";
}

function createCard(item){
  const card = document.createElement("div");
  card.className = "card";
  card.draggable = true;
  card.dataset.id = item.id;

  const img = document.createElement("img");
  img.src = item.image;
  img.alt = item.id;
  card.appendChild(img);

  card.addEventListener("dragstart", e => {
    card.classList.add("dragging");
    e.dataTransfer.setData("text/plain", item.id);
  });

  card.addEventListener("dragend", () => {
    card.classList.remove("dragging");
  });

  card.addEventListener("click", e => {
    e.stopPropagation();
    document.querySelectorAll(".card.selected").forEach(el => el.classList.remove("selected"));
    if(selectedCardId === item.id){
      selectedCardId = null;
      updateSelectedStatus();
      return;
    }
    selectedCardId = item.id;
    card.classList.add("selected");
    updateSelectedStatus();
  });

  return card;
}

function createPlaceholder(){
  const p = document.createElement("div");
  p.className = "placeholder";
  p.innerHTML = "画像を選択<br>またはドラッグ";
  return p;
}

function createSlot(index){
  const slot = document.createElement("div");
  slot.className = "slot";
  slot.dataset.index = index;

  slot.innerHTML = `
    <div class="slot-body"></div>
    <div class="slot-fields">
      <div class="field">
        <input type="text" placeholder="名前を入力">
      </div>
    </div>
  `;

  const body = slot.querySelector(".slot-body");
  body.appendChild(createPlaceholder());

  slot.addEventListener("dragover", e => {
    e.preventDefault();
    slot.classList.add("over");
  });

  slot.addEventListener("dragleave", () => {
    slot.classList.remove("over");
  });

  slot.addEventListener("drop", e => {
    e.preventDefault();
    slot.classList.remove("over");
    const id = e.dataTransfer.getData("text/plain");
    placeCardInSlot(id, slot);
  });

  slot.addEventListener("click", e => {
    if(e.target.tagName === "INPUT") return;
    if(selectedCardId){
      placeCardInSlot(selectedCardId, slot);
      document.querySelectorAll(".card.selected").forEach(el => el.classList.remove("selected"));
      selectedCardId = null;
      updateSelectedStatus();
    }
  });

  return slot;
}

function placeCardInSlot(cardId, slot){
  const card = document.querySelector(`.card[data-id="${cardId}"]`);
  if(!card) return;

  const targetBody = slot.querySelector(".slot-body");
  const existingCard = targetBody.querySelector(".card");
  const currentParentSlot = card.closest(".slot");
  const currentBody = currentParentSlot ? currentParentSlot.querySelector(".slot-body") : null;

  if(existingCard === card) return;

  if(existingCard && currentBody){
    targetBody.innerHTML = "";
    targetBody.appendChild(card);

    currentBody.innerHTML = "";
    currentBody.appendChild(existingCard);
    return;
  }

  if(existingCard){
    pool.appendChild(existingCard);
  }

  if(currentBody){
    currentBody.innerHTML = "";
    currentBody.appendChild(createPlaceholder());
  }

  targetBody.innerHTML = "";
  targetBody.appendChild(card);
}

function buildAnswerArea(){
  answerGrid.innerHTML = "";
  groups.forEach(group => {
    const section = document.createElement("section");
    section.className = "answer-group";

    if(group.title){
      const title = document.createElement("h3");
      title.className = "answer-group-title";
      title.textContent = group.title;
      section.appendChild(title);
    }

    const row = document.createElement("div");
    row.className = "answer-row";

    for(let i = group.start; i <= group.end; i++){
      const wrap = document.createElement("div");
      wrap.className = "slot-wrap";

      const no = document.createElement("div");
      no.className = "slot-no";
      no.textContent = `【${i}】`;

      wrap.appendChild(no);
      wrap.appendChild(createSlot(i - 1));
      row.appendChild(wrap);
    }

    section.appendChild(row);
    answerGrid.appendChild(section);
  });
}

function resetAll(){
  answerGrid.querySelectorAll(".slot").forEach(slot => {
    const body = slot.querySelector(".slot-body");
    const card = body.querySelector(".card");
    if(card) pool.appendChild(card);
    body.innerHTML = "";
    body.appendChild(createPlaceholder());
  });
  answerGrid.querySelectorAll("input").forEach(input => input.value = "");
  document.querySelectorAll(".card.selected").forEach(el => el.classList.remove("selected"));
  selectedCardId = null;
  updateSelectedStatus();
  shufflePool();
}

function shufflePool(){
  const cards = Array.from(pool.children);
  for(let i = cards.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  cards.forEach(card => pool.appendChild(card));
}

buildAnswerArea();
initialItems.forEach(item => pool.appendChild(createCard(item)));
shufflePool();
updateSelectedStatus();
resetBtn.addEventListener("click", resetAll);
</script>
</body>
</html>
