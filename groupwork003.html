<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>グループワークその３</title>
<style>
  :root{
    --text:#67315f;
    --muted:#a45d96;
    --panel:rgba(255,255,255,.88);
    --panel2:rgba(255,245,252,.94);
    --line:#f5a3d3;
    --line2:#ffd166;
    --accent:#ff6fbd;
    --blue:#7edcff;
    --green:#68d8b6;
  }

  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;
    font-family:Arial, "Helvetica Neue", Helvetica, "Yu Gothic", "Yu Gothic UI", Meiryo, sans-serif;
    line-height:1.5;
    color:var(--text);
    background:
      radial-gradient(circle at 14% 12%, rgba(255,255,255,.95) 0 2%, transparent 5%),
      radial-gradient(circle at 88% 10%, rgba(255,255,255,.92) 0 2%, transparent 5%),
      radial-gradient(circle at 20% 8%, #fff4b8 0 8%, transparent 25%),
      radial-gradient(circle at 84% 14%, #c9f4ff 0 7%, transparent 24%),
      radial-gradient(circle at 50% 100%, #ffe2f3 0 22%, transparent 48%),
      linear-gradient(135deg,#ffe0f2 0%, #fff8cf 46%, #dff8ff 100%);
    background-attachment:fixed;
  }

  body::before{
    content:"♡ ★ ✦ ♡ ★ ✦ ♡ ★";
    position:fixed;
    inset:10px 0 auto 0;
    text-align:center;
    font-size:22px;
    letter-spacing:20px;
    color:rgba(255,105,180,.24);
    pointer-events:none;
    z-index:0;
  }

  .app{
    position:relative;
    z-index:1;
    max-width:1440px;
    margin:0 auto;
    padding:18px 20px 44px;
  }

  .header{
    position:sticky;
    top:0;
    z-index:50;
    margin:-18px -20px 18px;
    padding:16px 20px;
    background:
      radial-gradient(circle at 12% 40%, rgba(255,111,189,.18), transparent 34%),
      linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,245,252,.92));
    backdrop-filter:blur(8px);
    border-bottom:2px solid rgba(245,163,211,.72);
    box-shadow:0 10px 24px rgba(204,78,158,.14);
  }

  .header-inner{
    max-width:1440px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
  }

  h1{
    margin:0;
    font-size:clamp(22px, 3vw, 34px);
    color:#7b2f72;
    letter-spacing:.02em;
    text-shadow:0 2px 0 rgba(255,255,255,.85);
  }

  .actions{
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
    flex:0 0 auto;
  }

  button,.answer-link-btn{
    border:2px solid rgba(245,163,211,.92);
    border-radius:999px;
    padding:12px 20px;
    background:linear-gradient(180deg,#fff,#fff0fa);
    color:var(--text);
    font-weight:900;
    font-family:inherit;
    font-size:15px;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:46px;
    box-shadow:0 5px 14px rgba(255,111,189,.18);
  }

  button:hover,.answer-link-btn:hover{
    filter:brightness(1.04);
    transform:translateY(-1px);
  }

  .answer-link-btn{
    background:linear-gradient(90deg,#ff6fbd,#ff9bd4,#ffd166);
    border-color:#ff7bc8;
    color:#fff;
    text-shadow:0 1px 1px rgba(128,35,104,.34);
  }

  .layout{
    display:grid;
    grid-template-columns:minmax(360px, 440px) 1fr;
    gap:20px;
    align-items:start;
  }

  .panel{
    background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,245,252,.90));
    border:2px solid rgba(245,163,211,.82);
    border-radius:24px;
    box-shadow:0 14px 34px rgba(204,78,158,.16), inset 0 0 0 2px rgba(255,255,255,.62);
  }

  .pool-panel{
    position:sticky;
    top:98px;
    max-height:calc(100vh - 118px);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .panel-head{
    padding:18px 18px 12px;
    border-bottom:2px solid rgba(245,163,211,.45);
  }

  .panel-title{
    margin:0;
    font-size:20px;
    color:#7b2f72;
  }

  .panel-note{
    margin:5px 0 0;
    color:var(--muted);
    font-size:13px;
  }

  .selected-status{
    margin-top:10px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px solid rgba(104,216,182,.50);
    background:rgba(104,216,182,.12);
    color:#28705c;
    border-radius:999px;
    padding:6px 10px;
    font-size:12px;
    font-weight:900;
  }

  .pool-scroll{
    overflow:auto;
    padding:16px;
  }

  .pool{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:14px;
  }

  .card{
    background:linear-gradient(180deg,#fff,#fff6fb);
    border:2px solid rgba(245,163,211,.68);
    border-radius:18px;
    padding:8px;
    min-height:154px;
    cursor:grab;
    user-select:none;
    box-shadow:0 8px 18px rgba(204,78,158,.14);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .card:active{cursor:grabbing}
  .card.dragging{opacity:.45; transform:scale(.98)}
  .card.selected{
    border-color:#ffd166;
    box-shadow:0 0 0 4px rgba(255,209,102,.30), 0 10px 24px rgba(204,78,158,.18);
  }

  .card img{
    width:100%;
    height:100%;
    max-height:150px;
    object-fit:contain;
    display:block;
    border-radius:12px;
    background:transparent;
  }

  .answer-panel{
    padding:18px;
  }

  .answer-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    margin-bottom:16px;
  }

  .answer-header h2{
    margin:0;
    font-size:24px;
    color:#7b2f72;
  }

  .legend{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
    color:var(--muted);
    font-size:12px;
  }

  .legend span{
    border:1px solid rgba(245,163,211,.50);
    background:rgba(255,255,255,.55);
    border-radius:999px;
    padding:6px 9px;
    font-weight:800;
  }

  .answer-group{
    border:2px solid rgba(245,163,211,.55);
    border-radius:22px;
    overflow:hidden;
    margin-bottom:18px;
    background:rgba(255,255,255,.48);
  }

  .answer-group-title{
    margin:0;
    padding:12px 16px;
    font-size:17px;
    color:#7b2f72;
    letter-spacing:.02em;
    background:linear-gradient(90deg, rgba(255,111,189,.22), rgba(255,209,102,.18), rgba(126,220,255,.12));
    border-bottom:2px solid rgba(245,163,211,.36);
  }

  .answer-row{
    display:grid;
    grid-template-columns:repeat(4, minmax(0,1fr));
    gap:14px;
    padding:16px;
  }

  .slot-wrap{min-width:0}

  .slot-no{
    color:#d94ca8;
    font-weight:900;
    font-size:15px;
    margin-bottom:8px;
    letter-spacing:.04em;
  }

  .slot{
    min-height:238px;
    background:linear-gradient(180deg, rgba(255,255,255,.74), rgba(255,241,250,.86));
    border:2px dashed rgba(245,163,211,.88);
    border-radius:18px;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:.15s ease;
  }

  .slot.over{
    border-color:#ff6fbd;
    background:rgba(255,238,248,.96);
    box-shadow:0 0 0 4px rgba(255,111,189,.16);
  }

  .slot-body{
    height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-radius:14px;
    background:rgba(255,255,255,.50);
  }

  .slot-body .card{
    width:100%;
    height:100%;
    min-height:0;
    box-shadow:none;
    padding:6px;
  }

  .placeholder{
    width:100%;
    text-align:center;
    color:#b66ca7;
    font-size:13px;
    font-weight:900;
    line-height:1.7;
    padding:12px;
  }

  .slot-fields{
    display:grid;
    gap:8px;
    margin-top:auto;
  }

  .field input{
    width:100%;
    height:40px;
    border:1px solid rgba(245,163,211,.65);
    border-radius:999px;
    background:rgba(255,255,255,.96);
    color:#65325f;
    padding:8px 12px;
    font-family:inherit;
    font-size:14px;
    box-shadow:inset 0 1px 2px rgba(200,70,150,.08);
  }

  .field input::placeholder{color:#c88abc}

  .hint{
    margin:22px 0 0;
    color:var(--muted);
    font-size:12px;
    text-align:center;
    font-weight:800;
  }

  @media (max-width:1180px){
    .layout{grid-template-columns:1fr}
    .pool-panel{position:static; max-height:none}
    .pool{grid-template-columns:repeat(4, minmax(130px,1fr))}
    .answer-row{grid-template-columns:repeat(4, minmax(0,1fr))}
  }

  @media (max-width:760px){
    .header-inner{align-items:flex-start; flex-direction:column}
    .actions{width:100%}
    button,.answer-link-btn{flex:1}
    .pool{grid-template-columns:repeat(2, minmax(0,1fr))}
    .answer-row{grid-template-columns:1fr}
    .slot{min-height:230px}
  }

  .slot-label-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .no-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .hint-btn{
    width:26px;
    height:26px;
    min-height:0;
    padding:0;
    border-radius:50%;
    border:2px solid rgba(245,163,211,.92);
    background:#fff;
    color:#7b2f72;
    font-weight:900;
    font-size:16px;
    line-height:1;
    box-shadow:0 3px 8px rgba(204,78,158,.18);
    flex:0 0 auto;
  }
  .hint-popover{
    display:none;
    position:fixed;
    z-index:9999;
    width:min(460px, calc(100vw - 32px));
    max-height:min(360px, calc(100vh - 32px));
    overflow:auto;
    padding:14px 40px 14px 16px;
    border:2px solid var(--yellow, #ffd166);
    border-radius:14px;
    background:#fff9e8;
    color:#7a2f14;
    box-shadow:0 14px 34px rgba(0,0,0,.34);
    font-size:14px;
    line-height:1.7;
    text-align:left;
  }
  .hint-popover.show{ display:block; }
  .hint-title{
    font-weight:900;
    font-size:15px;
    margin-bottom:6px;
  }
  .hint-close{
    position:absolute;
    right:10px;
    top:8px;
    border:0;
    background:transparent;
    color:#7a2f14;
    width:24px;
    height:24px;
    min-height:0;
    padding:0;
    font-size:22px;
    line-height:1;
    box-shadow:none;
  }


  .slot.correct{
    border-color:#6ee7b7 !important;
    box-shadow:0 0 0 4px rgba(110,231,183,.22);
  }

  .slot.incorrect{
    border-color:#ff6b6b !important;
    box-shadow:0 0 0 4px rgba(255,107,107,.18);
  }

  .result-badge{
    margin-top:6px;
    text-align:center;
    font-weight:900;
    font-size:13px;
    border-radius:10px;
    padding:4px 6px;
  }

  .result-ok{
    background:rgba(110,231,183,.16);
    color:#1f8a68;
  }

  .result-ng{
    background:rgba(255,107,107,.16);
    color:#e24d4d;
  }

</style>
</head>

        <a class="answer-link-btn" href="groupwork003_answer.html" target="_blank" rel="noopener">解答へ</a>
      </div>

  <main class="layout">
    <section class="panel pool-panel">
      <div class="panel-head">
        <h2 class="panel-title">プリキュア画像一覧</h2>
        <p class="panel-note">クリックで選択 → 右側の配置先をクリックして配置できます。</p>
        <div class="selected-status" id="selectedStatus">未選択</div>
      </div>
      <div class="pool-scroll">

    <section class="panel answer-panel">

        <div class="legend">
          <span>クリック配置対応</span>
          <span>ドラッグ対応</span>
          <span>入れ替え対応</span>
        </div>
      </div>

      <div id="answerGrid"></div>
      <p class="hint">※ 配置済みの画像同士をドラッグすると、入れ替えることができます。</p>
    </section>
  </main>
</div>

<script>
const initialItems = [{"id": "p01", "image": "gw03img/nagisa.png"}, {"id": "p02", "image": "gw03img/mnagisa.png"}, {"id": "p03", "image": "gw03img/saki.png"}, {"id": "p04", "image": "gw03img/nozomi.png"}, {"id": "p05", "image": "gw03img/ynozomi.png"}, {"id": "p06", "image": "gw03img/love.png"}, {"id": "p07", "image": "gw03img/tsubomi.png"}, {"id": "p08", "image": "gw03img/hibiki.png"}, {"id": "p09", "image": "gw03img/miyuki.png"}, {"id": "p10", "image": "gw03img/ayumi.png"}, {"id": "p11", "image": "gw03img/mana.png"}, {"id": "p12", "image": "gw03img/megumi.png"}, {"id": "p13", "image": "gw03img/haruka.png"}, {"id": "p14", "image": "gw03img/mirai.png"}, {"id": "p15", "image": "gw03img/ichika.png"}, {"id": "p16", "image": "gw03img/hana.png"}, {"id": "p17", "image": "gw03img/hikaru.png"}, {"id": "p18", "image": "gw03img/nodoka.png"}, {"id": "p19", "image": "gw03img/manatsu.png"}, {"id": "p20", "image": "gw03img/yui.png"}, {"id": "p21", "image": "gw03img/sora.png"}, {"id": "p22", "image": "gw03img/komugi.png"}, {"id": "p23", "image": "gw03img/uta.png"}, {"id": "p24", "image": "gw03img/annna.png"}];

const groups = [
  {title:"プリキュアシリーズ順", start:1, end:24, cols:6}
];

const hints = {
  "1": "作品テーマは「光と闇・友情(バディ)」。<br>コンセプトは「女の子だって暴れたい」。<br>美墨なぎさがカードコミューンを使い変身する。<br>偉大なる初代プリキュア、かつ最強プリキュア。<br>題名通り、変身・必殺技発動は相方のキュアホワイトと二人が揃わないとできないという制約がある。<br>とにかく拳と蹴りで全てを解決するスタイル。<br>力のプリキュア。<br>対してキュアホワイトは関節技を織り交ぜたりするので、技のプリキュアである。",
  "2": "作品テーマは「命・絆」。<br>前作に引き続き、美墨なぎさがハートフルコミューン(妖精変身型)を使い変身する。<br>姿は前作と比べてヘソ出しがなくなり、フリルやラインが増えるなど少し豪華になっている。<br>コスチュームデザインのコンセプトは「西部劇のガンマン」とのこと。<br>基本オールスターズはこちらの姿で登場する。",
  "3": "作品テーマは「花鳥風月・自然」。<br>日向咲がミックスコミューン(妖精変身型)を使い変身する。<br>大地の精霊の力がベースで、イメージカラーは黄色ではなく金色とのこと。<br>キュアイーグレットとの友情度によって強さが変化する。<br>前作までがあまりに肉弾戦すぎたので、攻撃を受けた際は自動的にバリア的なものが発生するようになった。<br>前作までとおなじく相方のキュアイーグレットと二人が揃わないと変身や必殺技発動ができない。",
  "4": "作品テーマは「夢・蝶・チーム」。<br>夢原のぞみがピンキーキャッチュ(腕時計型)を使い変身する。<br>いわゆるプリキュアの主人公カラーであるピンク(桃キュア)はこの時点から。<br>今作から単独での変身・単独での必殺技発動が可能になった。<br>(一応シャイニールミナスが単独変身できたが)<br>デザインモチーフは「蝶」。<br>声優はNARUTOのナルトやエウレカのレントンで有名な三瓶由布子。<br>数少ない少女役のひとつ。",
  "5": "作品テーマは「希望・成長・薔薇」。<br>前作に引き続き、夢原のぞみがキュアモ(携帯電話型)を使い変身する。<br>前作とはデザインモチーフが異なり、今作は「薔薇」。<br>前作は元気イメージな姿だったが、今作は襟付きジャケットとなりカッコ良い方向に。<br>初代に次いで人気が今でも高いプリキュアで、2023年には成人後のストーリー「オトナプリキュア」がNHKで放送された。<br>(※パラレル設定のスピンオフ扱い)",
  "6": "作品テーマは「ダンス・フルーツ・幸福(四葉のクローバー)」。<br>桃園ラブがリンクルン(携帯電話型)を使い変身する。<br>キャラデザ的に大きな変化があったため色々と物議を醸した。<br>戦闘スタイルは飛び技的なものが多かった前作と比べて、初代寄りの拳で解決するタイプに戻った。<br>あまりに気合の入り方が漢らしいため、「ラブ兄貴」と呼ばれることに。<br>プリキュアといえばEDの3Dキャラダンスが特徴的だが、その形式になったのは今作から。<br>振付師は今は亡きお笑いタレントの前田健氏。",
  "7": "作品テーマは「花・ファッション・心」。<br>花咲つぼみがココロパフューム(香水瓶型)を使い変身する。<br>デザインモチーフは「桜」。<br>これまでの主人公は元気が良いことが共通項だったが、つぼみはかなり内向的で敵幹部から「史上最弱のプリキュア」呼ばわりされた。<br>逆に相方のキュアマリンは、歴代プリキュアの中でも色々と規格外なはっちゃけ具合のプリキュア。<br>声優は水樹奈々。歌上手い。",
  "8": "作品テーマは「音楽・友情」。<br>北条響がキュアモジューレ(ブローチ型)を使い変身する。<br>変身は相方のキュアリズムと二人揃わないとできない。<br>これまでのプリキュアと異なり、相方のキュアリズムとは結構な割合で喧嘩をする。<br>(基本的には仲の良い幼馴染)<br>プリキュア初の敵味方死傷者ゼロの作品。<br>東日本大震災時の作品で、後半の内容に大きな影響を与えた。",
  "9": "作品テーマは「絵本・おとぎ話・笑顔」。<br>星空みゆきがスマイルパクト(コンパクト型)を使い変身する。<br>歴代プリキュアの中でもダントツに勉強が苦手。<br>巨大ロボになった唯一のプリキュア。<br>ちなみに変身時のポーズは「天地魔闘の構え」。<br>震災の翌年でもあり、「被災地には毎週必ずプリキュアを視聴できる環境では無い子供達がいる」という理由からこれまでのシリーズでは定番だった追加戦士は存在しない。",

  "11": "作品テーマは「トランプ・愛」<br>相田マナがラブリーコミューン(スマホ型)を使い変身する。<br>初代以降久しぶりの、左右非対称コスチュームのプリキュア。<br>生徒会長・成績優秀・スポーツ万能・強メンタル、と前作の主人公の対極にいるような存在。<br>ちなみに今作のプリキュアはみな高スペック人間なのも特徴。<br>将来の夢は総理大臣、だったのだが最終回で本当に総理大臣になってしまった。<br>相方のキュアダイヤモンドの感情が重すぎる。",
  "12": "作品テーマは「幸せ・おしゃれ」<br>愛乃めぐみがプリチェンミラー(携帯ミラー型)を使い変身する。<br>世界中にプリキュアがいて、多くの人がプリキュアに憧れているという世界。<br>仮面ライダーのように複数のフォームを使って戦う。<br>炎属性のプリキュアなのだが、主人公が炎属性なのは意外にもただ一人。<br>シリーズ10周年の作品で記念的作品でもある。<br>相方のキュアプリンセスはキュアマリンのようなプリキュアでは珍しいギャグ要員タイプ。",
  "13": "作品テーマは「プリンセス・夢」。<br>春野はるかがプリンセスパフューム(香水瓶型)を使い変身する。<br>盛り髪・金髪・ティアラとまさしくテーマ通りのお姫様姿。<br>なのだが、戦闘スタイルは初代ばりの強力な蹴りを中心としたものでお姫様具合は減ってしまう。<br>ちなみに攻撃がヒットすると打撃箇所から花吹雪が散る。<br>作品全体もいわゆるノブレス・セレブリティな感じで統一されている。<br>王族・貴族というわけではなく「強く・優しく・美しく」の<br>気品ある姿を目指して、が軸となっている。<br>強化フォームが5種類もある珍しいプリキュア。",
  "14": "作品テーマは「魔法使い・手を繋ぐ」。<br>朝日奈みらいが妖精のモフルンから力を借りて変身する。<br>基本的に、妖精のモフルンと相方のキュアマジカルが揃わないと変身できない。<br>ハピプリと同じく複数のフォーム/スタイルを使って戦う。<br>先輩たちのような肉弾戦中心ではなく、テーマらしく魔法的なものや一撃必殺的な戦いをする。<br>初めてタイトルに漢字が使われたプリキュア。<br>また「オトナプリキュア」とは異なり、正式な続編(全12話)が2025年に放送された。",
  "15": "作品テーマは「スイーツ・アニマル・光と闇」。<br>宇佐美いちかがスイーツパクト(コンパクト型)を使って変身する。<br>モチーフ通りの長いウサミミが特徴のプリキュア。<br>ウサギらしく、高い脚力と聴力を活かした戦い方をする。<br>主人公にしては珍しくギャグ要員の要素が強い。<br>「個性」が作品の軸としてもあり、登場するプリキュアたちは他の作品と異なりコスチュームに統一性がない。",
  "16": "作品テーマは「母性・子育て・仕事」。<br>野乃はながプリハート(スマホ型)を使い変身する。<br>初のスニーカーを履いたプリキュアでもある。<br>シリーズ15周年ということもあり、過去作のオマージュが随所に見られる。<br>過去作で妖精のお世話(育児)はあったものの、人間の赤ちゃんのお世話をテーマにしたのは初めて。<br>最終回では大人になったはなが出産するシーンが描かれて反響を呼んだ。",
  "17": "作品テーマは「宇宙・星座・多様性」。<br>星奈ひかるがスターカラーペンダント(ペンダント型)を使って変身する。<br>プリキュア名に作品名が入るのは実は初めて。<br>作品名らしく星座の名前が入った必殺技を使う。<br>地球以外で初変身し、宇宙での戦いも多いプリキュア。<br>前作より明るい雰囲気の作品となっている。<br>褐色肌のプリキュアや宇宙人のプリキュアなど、多様性が意識されている。",
  "18": "作品テーマは「お医者さん・思いやり・生きる」。<br>花寺のどかがヒーリングステッキ(ステッキ型)を使い変身する。<br>長期にわたる入院生活を経て、ようやく退院し引っ越してきたところから物語が始まる。<br>プリキュア全員が医療・医療従事者との関わりがある作品。<br>生きることをテーマとしているので、これまでのシリーズでは避けられてきた「死ぬ」という言葉も自然に使われている。<br>こちらも強化フォームが5種類もある珍しいプリキュア。",
  "19": "作品テーマは「夏・海・コスメ・一番大事なこと」。<br>夏海まなつがトロピカルパクト(パクト型)を使い変身する。<br>常夏モチーフらしい、セーラ服的な白基調のプリキュア。<br>基本、白がイメージカラーのプリキュアはいわゆる相方つまり「2人目」のポジションだったが、今作は主人公である。<br>コロナ禍の最中でもあり、視聴者に元気を与えることを目的としてかなり明るめの雰囲気になっている。<br>声優はファイルーズあい、まさに雰囲気にぴったり。",
  "20": "作品テーマは「料理(ごはん)・ありがとう・シェア」。<br>和実ゆいが妖精の力を借りて変身する。<br>料理がテーマのため、エプロンをつけたコスチュームになっている。<br>勾玉風の装飾や足袋っぽいヒールなど、「和」を感じさせる。<br>カロリーをパンチに変換して攻撃するという、全人類が夢見る力で戦う。<br>コロナ禍での黙食に対して、アニメの中だけでも一緒に食事をする楽しさを伝えたい、という思いも。<br>(プリアラの「作る」に対して今作は「食べる」がメイン)",
  "21": "作品テーマは「空・神話・ヒーロー」。<br>ソラ・ハレワタールがミラージュペン(ペン型)を使い変身する。<br>シリーズ初の「青キュア」主人公。<br>そしてシリーズ初の「異世界人」主人公。<br>シリーズ20周年の作品で、様々な挑戦がされている。<br>純粋な大人のプリキュア(18歳)、赤ちゃんプリキュア、そして<b>男性のプリキュア</b>、とシリーズ初がてんこ盛りである。",
  "22": "作品テーマは「動物・友達」。<br>犬飼こむぎがワンダフルパクト(コンパクト型)を使い変身する。<br>前作は純粋な異世界人が主人公だったが、今作は純粋な<br>「犬(パピヨン犬)」が主人公。<br>飼い主であるキュアフレンディ(犬飼いろは)とのダブル主人公のような形にはなっている。<br>タイトルがすべてひらがなになるのは何気に初めて。<br>敵に一切攻撃をしない、が特徴のプリキュア。",
  "23": "作品テーマは「アイドル・ファン」。<br>咲良うたがアイドルハートブローチ(ブローチ型)を使い変身する。<br>防御という言葉が存在しないプリキュア、薩摩武士。<br>何気にプリキュアでアイドルをテーマにしたのは初めて。<br>過去作でアイドル活動をするプリキュアはいたが、全体テーマとしては初であり、今まで避けてきたとのこと。<br>普通の中学生が妖精の力で変身する、という原点回帰したプリキュアでもある。",
  "24": "作品テーマは「名探偵・タイムトラベル・本当の答え」。<br>ジュエルキュアウォッチ(懐中時計)を使い変身する。<br>もう一人の主人公キュアミスティックと同時変身するが、<br>揃ってないと変身できないという訳ではない。<br>イメージカラーは「紫」。<br>ということで初の「紫キュア」主人公。<br>同時変身はまほプリ以来の10年ぶり。<br>舞台はタイムスリップした1999年。<br>敵対組織は「怪盗団ファントム」で、どうしても某ゲームの<br>心の怪盗団を思い起こさせる。"
};


const correctOrder = ["p01","p02","p03","p04","p05","p06","p07","p08","p09","p10","p11","p12","p13","p14","p15","p16","p17","p18","p19","p20","p21","p22","p23","p24"];

function clearResults(){
  document.querySelectorAll(".slot").forEach(slot => {
    slot.classList.remove("correct","incorrect");
    const badge = slot.querySelector(".result-badge");
    if(badge) badge.remove();
  });
}

function checkAnswers(){
  clearResults();

  let correct = 0;

  document.querySelectorAll(".slot").forEach((slot, idx) => {
    const body = slot.querySelector(".slot-body");
    const card = body.querySelector(".card");

    const badge = document.createElement("div");
    badge.className = "result-badge";

    if(card && card.dataset.id === correctOrder[idx]){
      slot.classList.add("correct");
      badge.classList.add("result-ok");
      badge.textContent = "正解";
      correct++;
    }else{
      slot.classList.add("incorrect");
      badge.classList.add("result-ng");
      badge.textContent = "不正解";
    }

    slot.appendChild(badge);
  });

  const board = document.getElementById("scoreBoard");
  board.textContent = `正解数：${correct} / ${correctOrder.length}`;

  if(correct === correctOrder.length){
    board.textContent += "　🎉 全問正解！";
  }
}

const answerGrid = document.getElementById("answerGrid");
const pool = document.getElementById("pool");
const resetBtn = document.getElementById("resetBtn");
const selectedStatus = document.getElementById("selectedStatus");
let selectedCardId = null;

function updateSelectedStatus(){
  selectedStatus.textContent = selectedCardId ? "画像を選択中" : "未選択";
}

function createCard(item){
  const card = document.createElement("div");
  card.className = "card";
  card.draggable = true;
  card.dataset.id = item.id;

  const img = document.createElement("img");
  img.src = item.image;
  img.alt = item.id;
  card.appendChild(img);

  card.addEventListener("dragstart", e => {
    card.classList.add("dragging");
    e.dataTransfer.setData("text/plain", item.id);
  });

  card.addEventListener("dragend", () => {
    card.classList.remove("dragging");
  });

  card.addEventListener("click", e => {
    e.stopPropagation();
    document.querySelectorAll(".card.selected").forEach(el => el.classList.remove("selected"));
    if(selectedCardId === item.id){
      selectedCardId = null;
      updateSelectedStatus();
      return;
    }
    selectedCardId = item.id;
    card.classList.add("selected");
    updateSelectedStatus();
  });

  return card;
}

function createPlaceholder(){
  const p = document.createElement("div");
  p.className = "placeholder";
  p.innerHTML = "画像を選択<br>またはドラッグ";
  return p;
}

function createSlot(index){
  const slot = document.createElement("div");
  slot.className = "slot";
  slot.dataset.index = index;

  slot.innerHTML = `
    <div class="slot-body"></div>
    <div class="slot-fields">
      <div class="field">
        <input type="text" placeholder="名前を入力">
      </div>
      <div class="field">
        <input type="text" placeholder="タイトルを入力">
      </div>
    </div>
  `;

  const body = slot.querySelector(".slot-body");
  body.appendChild(createPlaceholder());

  slot.addEventListener("dragover", e => {
    e.preventDefault();
    slot.classList.add("over");
  });

  slot.addEventListener("dragleave", () => {
    slot.classList.remove("over");
  });

  slot.addEventListener("drop", e => {
    e.preventDefault();
    slot.classList.remove("over");
    const id = e.dataTransfer.getData("text/plain");
    placeCardInSlot(id, slot);
  });

  slot.addEventListener("click", e => {
    if(e.target.tagName === "INPUT") return;
    if(selectedCardId){
      placeCardInSlot(selectedCardId, slot);
      document.querySelectorAll(".card.selected").forEach(el => el.classList.remove("selected"));
      selectedCardId = null;
      updateSelectedStatus();
    }
  });

  return slot;
}

function placeCardInSlot(cardId, slot){
  const card = document.querySelector(`.card[data-id="${cardId}"]`);
  if(!card) return;

  const targetBody = slot.querySelector(".slot-body");
  const existingCard = targetBody.querySelector(".card");
  const currentParentSlot = card.closest(".slot");
  const currentBody = currentParentSlot ? currentParentSlot.querySelector(".slot-body") : null;

  if(existingCard === card) return;

  if(existingCard && currentBody){
    targetBody.innerHTML = "";
    targetBody.appendChild(card);

    currentBody.innerHTML = "";
    currentBody.appendChild(existingCard);
    return;
  }

  if(existingCard){
    pool.appendChild(existingCard);
  }

  if(currentBody){
    currentBody.innerHTML = "";
    currentBody.appendChild(createPlaceholder());
  }

  targetBody.innerHTML = "";
  targetBody.appendChild(card);
}


function clamp(value, min, max){
  return Math.min(Math.max(value, min), max);
}
function closeHints(){
  document.querySelectorAll(".hint-popover.show").forEach(el => el.classList.remove("show"));
}
function positionHint(button, popover){
  const margin = 16;
  const rect = button.getBoundingClientRect();
  popover.classList.add("show");
  const width = Math.min(460, window.innerWidth - margin * 2);
  popover.style.width = width + "px";
  const popRect = popover.getBoundingClientRect();
  let left = rect.left - 42;
  left = clamp(left, margin, window.innerWidth - popRect.width - margin);
  let top = rect.bottom + 10;
  if(top + popRect.height > window.innerHeight - margin){
    top = rect.top - popRect.height - 10;
  }
  top = clamp(top, margin, window.innerHeight - popRect.height - margin);
  popover.style.left = left + "px";
  popover.style.top = top + "px";
}
function bindHintButtons(){
  document.querySelectorAll(".hint-btn").forEach(button => {
    button.addEventListener("click", event => {
      event.stopPropagation();
      const popover = document.getElementById("hint-" + button.dataset.no);
      const wasOpen = popover.classList.contains("show");
      closeHints();
      if(!wasOpen) positionHint(button, popover);
    });
  });
  document.querySelectorAll(".hint-close").forEach(button => {
    button.addEventListener("click", event => {
      event.stopPropagation();
      button.closest(".hint-popover").classList.remove("show");
    });
  });
}
document.addEventListener("click", closeHints);
document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeHints();
});
window.addEventListener("resize", closeHints);
window.addEventListener("scroll", closeHints, true);

function buildAnswerArea(){
  answerGrid.innerHTML = "";
  groups.forEach(group => {
    const section = document.createElement("section");
    section.className = "answer-group";

    if(group.title){
      const title = document.createElement("h3");
      title.className = "answer-group-title";
      title.textContent = group.title;
      section.appendChild(title);
    }

    const row = document.createElement("div");
    row.className = "answer-row";

    for(let i = group.start; i <= group.end; i++){
      const wrap = document.createElement("div");
      wrap.className = "slot-wrap";

      const labelRow = document.createElement("div");
      labelRow.className = "slot-label-row";

      const no = document.createElement("div");
      no.className = "slot-no";
      no.textContent = `【${i}】`;
      labelRow.appendChild(no);

      const hintBtn = document.createElement("button");
      hintBtn.type = "button";
      hintBtn.className = "hint-btn";
      hintBtn.textContent = "?";
      hintBtn.dataset.no = String(i);
      hintBtn.setAttribute("aria-label", "ヒントを表示");

      const hintBox = document.createElement("div");
      hintBox.className = "hint-popover";
      hintBox.id = "hint-" + i;
      hintBox.innerHTML = `
        <button type="button" class="hint-close" aria-label="ヒントを閉じる">×</button>
        <div class="hint-title">【${i}】のヒント：</div>
        <div class="hint-text">${hints[String(i)]}</div>
      `;

      labelRow.appendChild(hintBtn);
      labelRow.appendChild(hintBox);

      wrap.appendChild(labelRow);
      wrap.appendChild(createSlot(i - 1));
      row.appendChild(wrap);
    }

    section.appendChild(row);
    answerGrid.appendChild(section);
  });
}

function resetAll(){
  clearResults();
  document.getElementById("scoreBoard").textContent = "未採点";
  answerGrid.querySelectorAll(".slot").forEach(slot => {
    const body = slot.querySelector(".slot-body");
    const card = body.querySelector(".card");
    if(card) pool.appendChild(card);
    body.innerHTML = "";
    body.appendChild(createPlaceholder());
  });
  answerGrid.querySelectorAll("input").forEach(input => input.value = "");
  document.querySelectorAll(".card.selected").forEach(el => el.classList.remove("selected"));
  selectedCardId = null;
  updateSelectedStatus();
  shufflePool();
}

function shufflePool(){
  const cards = Array.from(pool.children);
  for(let i = cards.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  cards.forEach(card => pool.appendChild(card));
}

buildAnswerArea();
initialItems.forEach(item => pool.appendChild(createCard(item)));
shufflePool();
updateSelectedStatus();
bindHintButtons();
document.getElementById("checkBtn").addEventListener("click", checkAnswers);
resetBtn.addEventListener("click", resetAll);
</script>
