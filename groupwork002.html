<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>グループワークその２</title>
<style>
  :root{
    --bg:#08090d;
    --panel:#141722;
    --panel2:#1b2030;
    --line:#4a536b;
    --line2:#d73a31;
    --text:#f4f7ff;
    --muted:#aeb7cc;
    --accent:#ff4b3f;
    --gold:#ffd166;
    --green:#6ee7b7;
  }

  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;
    font-family:Arial, "Helvetica Neue", Helvetica, "Yu Gothic", "Yu Gothic UI", Meiryo, sans-serif;
    line-height:1.5;
    color:var(--text);
    background:
      radial-gradient(circle at 18% 12%, rgba(255,75,63,.30), transparent 25%),
      radial-gradient(circle at 84% 18%, rgba(110,231,183,.18), transparent 23%),
      linear-gradient(115deg, transparent 0 44%, rgba(255,75,63,.16) 44% 46%, transparent 46% 100%),
      linear-gradient(245deg, transparent 0 53%, rgba(255,209,102,.10) 53% 55%, transparent 55% 100%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 2px, transparent 2px 22px),
      linear-gradient(180deg,#120606 0%, #17120e 46%, #08090d 100%);
    background-size:auto,auto,auto,auto,42px 42px,auto;
    background-attachment:fixed;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      linear-gradient(90deg, rgba(255,75,63,.08), transparent 22%, transparent 78%, rgba(110,231,183,.06)),
      repeating-linear-gradient(90deg, transparent 0 80px, rgba(255,255,255,.035) 80px 82px);
    mix-blend-mode:screen;
    opacity:.75;
  }

  .app{
    max-width:1480px;
    margin:0 auto;
    padding:18px 20px 44px;
  }

  .header{
    position:sticky;
    top:0;
    z-index:50;
    margin:-18px -20px 18px;
    padding:16px 20px;
    background:
      radial-gradient(circle at 20% 14%, rgba(255,75,63,.18), transparent 30%),
      linear-gradient(115deg, transparent 0 44%, rgba(255,75,63,.12) 44% 46%, transparent 46% 100%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 2px, transparent 2px 22px),
      linear-gradient(180deg, rgba(20,23,34,.96), rgba(20,23,34,.92));
    background-size:auto,auto,42px 42px,auto;
    backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(255,75,63,.25);
    box-shadow:
      0 14px 34px rgba(0,0,0,.34),
      0 0 24px rgba(255,75,63,.08),
      inset 0 0 0 1px rgba(255,255,255,.03);
  }

  .header-inner{
    max-width:1480px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
  }

  h1{
    margin:0;
    font-size:clamp(22px, 3vw, 34px);
    letter-spacing:.02em;
  }

  .actions{
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
    flex:0 0 auto;
  }

  button,.answer-link-btn{
    border:1px solid rgba(255,75,63,.55);
    border-radius:14px;
    padding:12px 18px;
    background:linear-gradient(180deg, rgba(255,75,63,.24), rgba(255,75,63,.08));
    color:var(--text);
    font-weight:900;
    font-family:inherit;
    font-size:15px;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:46px;
  }

  button:hover,.answer-link-btn:hover{
    filter:brightness(1.12);
    box-shadow:0 0 20px rgba(255,75,63,.20);
  }

  .answer-link-btn{
    background:linear-gradient(180deg, #e13b31, #a91f18);
    border-color:#ff6b62;
    color:#fff;
  }

  .layout{
    display:grid;
    grid-template-columns:minmax(390px, 470px) 1fr;
    gap:20px;
    align-items:start;
  }

  .panel{
    background:rgba(20,23,34,.94);
    border:1px solid rgba(255,75,63,.34);
    border-radius:22px;
    box-shadow:0 14px 34px rgba(0,0,0,.34), 0 0 24px rgba(255,75,63,.08), inset 0 0 0 1px rgba(255,255,255,.03);
  }

  .pool-panel{
    position:sticky;
    top:98px;
    max-height:calc(100vh - 118px);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .panel-head{
    padding:18px 18px 12px;
    border-bottom:1px solid rgba(255,75,63,.18);
  }

  .panel-title{
    margin:0;
    font-size:20px;
  }

  .panel-note{
    margin:5px 0 0;
    color:var(--muted);
    font-size:13px;
  }

  .selected-status{
    margin-top:10px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px solid rgba(110,231,183,.35);
    background:rgba(110,231,183,.08);
    color:#bfffe8;
    border-radius:999px;
    padding:6px 10px;
    font-size:12px;
    font-weight:800;
  }

  .pool-scroll{
    overflow:auto;
    padding:16px;
  }

  .pool{
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:12px;
  }

  .card{
    background:linear-gradient(180deg, rgba(30,35,50,.94), rgba(16,20,30,.98));
    border:2px solid rgba(255,75,63,.18);
    border-radius:16px;
    padding:7px;
    min-height:136px;
    cursor:grab;
    user-select:none;
    box-shadow:0 8px 18px rgba(0,0,0,.24);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .card:active{cursor:grabbing}
  .card.dragging{opacity:.45; transform:scale(.98)}
  .card.selected{
    border-color:var(--gold);
    box-shadow:0 0 0 4px rgba(255,209,102,.26), 0 10px 24px rgba(0,0,0,.30);
  }

  .card img{
    width:100%;
    height:100%;
    max-height:132px;
    object-fit:contain;
    display:block;
    border-radius:10px;
    background:transparent;
  }

  .answer-panel{
    padding:18px;
  }

  .answer-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    margin-bottom:16px;
  }

  .answer-header h2{
    margin:0;
    font-size:24px;
  }

  .legend{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
    color:var(--muted);
    font-size:12px;
  }

  .legend span{
    border:1px solid rgba(255,75,63,.22);
    background:rgba(255,75,63,.06);
    border-radius:999px;
    padding:6px 9px;
  }

  .answer-group{
    border:1px solid rgba(255,75,63,.22);
    border-radius:20px;
    overflow:hidden;
    margin-bottom:18px;
    background:rgba(8,9,13,.34);
  }

  .answer-group-title{
    margin:0;
    padding:12px 16px;
    font-size:17px;
    letter-spacing:.02em;
    background:linear-gradient(90deg, rgba(255,75,63,.22), rgba(255,75,63,.04));
    border-bottom:1px solid rgba(255,75,63,.18);
  }

  .answer-row{
    display:grid;
    gap:12px;
    padding:16px;
  }

  .answer-row.cols-4{grid-template-columns:repeat(4, minmax(0,1fr))}
  .answer-row.cols-5{grid-template-columns:repeat(5, minmax(0,1fr))}
  .answer-row.cols-6{grid-template-columns:repeat(6, minmax(0,1fr))}
  .answer-row.cols-7{grid-template-columns:repeat(7, minmax(0,1fr))}
  .answer-row.cols-8{grid-template-columns:repeat(8, minmax(0,1fr))}

  .slot-wrap{min-width:0}

  .slot-no{
    color:#ffe1df;
    font-weight:900;
    font-size:15px;
    margin-bottom:8px;
    letter-spacing:.04em;
  }

  .slot{
    min-height:230px;
    background:linear-gradient(180deg, rgba(28,32,48,.82), rgba(12,14,22,.94));
    border:2px dashed rgba(255,75,63,.30);
    border-radius:18px;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:.15s ease;
  }

  .slot.over{
    border-color:var(--gold);
    background:rgba(255,209,102,.08);
    box-shadow:0 0 0 4px rgba(255,209,102,.13);
  }

  .slot-body{
    height:140px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-radius:14px;
    background:rgba(255,255,255,.035);
  }

  .slot-body .card{
    width:100%;
    height:100%;
    min-height:0;
    box-shadow:none;
    padding:6px;
  }

  .placeholder{
    width:100%;
    text-align:center;
    color:#c7cfdf;
    font-size:13px;
    font-weight:800;
    line-height:1.7;
    padding:12px;
  }

  .slot-fields{
    display:grid;
    gap:8px;
    margin-top:auto;
  }

  .field input{
    width:100%;
    height:40px;
    border:1px solid rgba(255,75,63,.22);
    border-radius:10px;
    background:rgba(255,255,255,.96);
    color:#151820;
    padding:8px 10px;
    font-family:inherit;
    font-size:14px;
  }

  .field input::placeholder{color:#75849b}

  .hint{
    margin:22px 0 0;
    color:var(--muted);
    font-size:12px;
    text-align:center;
  }

  @media (max-width:1240px){
    .layout{
      grid-template-columns:1fr;
    }
    .pool-panel{
      position:static;
      max-height:none;
    }
    .pool{
      grid-template-columns:repeat(5, minmax(120px, 1fr));
    }
    .answer-row.cols-8,
    .answer-row.cols-7,
    .answer-row.cols-6,
    .answer-row.cols-5{
      grid-template-columns:repeat(4, minmax(0,1fr));
    }
  }

  @media (max-width:760px){
    .header-inner{
      align-items:flex-start;
      flex-direction:column;
    }
    .actions{width:100%}
    button,.answer-link-btn{flex:1}
    .pool{grid-template-columns:repeat(2, minmax(0,1fr))}
    .answer-row.cols-8,
    .answer-row.cols-7,
    .answer-row.cols-6,
    .answer-row.cols-5,
    .answer-row.cols-4{
      grid-template-columns:1fr;
    }
    .slot{min-height:230px}
  }

  .slot-label-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }

  .no-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
    justify-content:flex-start;
  }

  .hint-btn{
    width:26px;
    height:26px;
    min-height:0;
    padding:0;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.72);
    background:#f4f8ff;
    color:#151820;
    font-weight:900;
    font-size:16px;
    line-height:1;
    box-shadow:0 3px 8px rgba(0,0,0,.22);
  }

  .hint-popover{
    display:none;
    position:fixed;
    z-index:9999;
    width:min(460px, calc(100vw - 32px));
    max-height:min(360px, calc(100vh - 32px));
    overflow:auto;
    padding:14px 40px 14px 16px;
    border:2px solid var(--gold, #ffd166);
    border-radius:14px;
    background:#fff9e8;
    color:#7a2f14;
    box-shadow:0 14px 34px rgba(0,0,0,.34);
    font-size:14px;
    line-height:1.7;
    text-align:left;
  }

  .hint-popover.show{
    display:block;
  }

  .hint-title{
    font-weight:900;
    font-size:15px;
    margin-bottom:6px;
  }

  .hint-close{
    position:absolute;
    right:10px;
    top:8px;
    border:0;
    background:transparent;
    color:#7a2f14;
    width:24px;
    height:24px;
    min-height:0;
    padding:0;
    font-size:22px;
    line-height:1;
    box-shadow:none;
  }


  .slot.correct{
    border-color:#6ee7b7 !important;
    box-shadow:0 0 0 4px rgba(110,231,183,.22);
  }

  .slot.incorrect{
    border-color:#ff6b6b !important;
    box-shadow:0 0 0 4px rgba(255,107,107,.18);
  }

  .result-badge{
    margin-top:6px;
    text-align:center;
    font-weight:900;
    font-size:13px;
    border-radius:10px;
    padding:4px 6px;
  }

  .result-ok{
    background:rgba(110,231,183,.16);
    color:#1f8a68;
  }

  .result-ng{
    background:rgba(255,107,107,.16);
    color:#e24d4d;
  }

</style>
</head>

const hints = {
  "1": "天才生化学者にしてスポーツ万能の本郷猛が変身する。<br>ショッカーに改造人間にされたが、洗脳される前に脱出。<br>天才らしく多彩な技で戦うため、「技の1号」と呼ばれる。<br>ちなみに本郷猛演じる藤岡弘。の息子、藤岡真威人も同役になったこともある。",

  "35": "王様になりたいという夢をもつ高校生の常磐ソウゴが、歴代ライダーと時空の力で変身する。<br>平成ライダー20周年記念かつ平成シリーズ最後のライダー。<br>顔にデカデカとライダー、とある素晴らしいデザイン。モチーフは時計。<br>平成10周年の時と似ているところもあり、まさにお祭り的な節目な作品。<br>未来を変えるための戦い、という要素が軸で複雑なストーリーとなっている。"

const correctOrder = ["r01","r02","r03","r04","r05","r06","r07","r08","r09","r10","r11","r12","r13","r14","r15","r16","r17","r18","r19","r20","r21","r22","r23","r24","r25","r26","r27","r28","r29","r30","r31","r32","r33","r34","r35"];

function clearResults(){
  document.querySelectorAll(".slot").forEach(slot => {
    slot.classList.remove("correct","incorrect");
    const badge = slot.querySelector(".result-badge");
    if(badge) badge.remove();
  });
}

function checkAnswers(){
  clearResults();

  let correct = 0;

  document.querySelectorAll(".slot").forEach((slot, idx) => {
    const body = slot.querySelector(".slot-body");
    const card = body.querySelector(".card");

    const badge = document.createElement("div");
    badge.className = "result-badge";

    if(card && card.dataset.id === correctOrder[idx]){
      slot.classList.add("correct");
      badge.classList.add("result-ok");
      badge.textContent = "正解";
      correct++;
    }else{
      slot.classList.add("incorrect");
      badge.classList.add("result-ng");
      badge.textContent = "不正解";
    }

    slot.appendChild(badge);
  });

  const board = document.getElementById("scoreBoard");
  board.textContent = `正解数：${correct} / ${correctOrder.length}`;

  if(correct === correctOrder.length){
    board.textContent += "　🎉 全問正解！";
  }
}

const answerGrid = document.getElementById("answerGrid");
const pool = document.getElementById("pool");
const resetBtn = document.getElementById("resetBtn");
const selectedStatus = document.getElementById("selectedStatus");
let selectedCardId = null;

function updateSelectedStatus(){
  selectedStatus.textContent = selectedCardId ? "画像を選択中" : "未選択";
}

function createCard(item){
  const card = document.createElement("div");
  card.className = "card";
  card.draggable = true;
  card.dataset.id = item.id;

  const img = document.createElement("img");
  img.src = item.image;
  img.alt = item.id;
  card.appendChild(img);

  card.addEventListener("dragstart", e => {
    card.classList.add("dragging");
    e.dataTransfer.setData("text/plain", item.id);
  });

  card.addEventListener("dragend", () => {
    card.classList.remove("dragging");
  });

  card.addEventListener("click", e => {
    e.stopPropagation();
    document.querySelectorAll(".card.selected").forEach(el => el.classList.remove("selected"));
    if(selectedCardId === item.id){
      selectedCardId = null;
      updateSelectedStatus();
      return;
    }
    selectedCardId = item.id;
    card.classList.add("selected");
    updateSelectedStatus();
  });

  return card;
}

function createPlaceholder(){
  const p = document.createElement("div");
  p.className = "placeholder";
  p.innerHTML = "画像を選択<br>またはドラッグ";
  return p;
}

function createSlot(index){
  const slot = document.createElement("div");
  slot.className = "slot";
  slot.dataset.index = index;

  slot.innerHTML = `
    <div class="slot-body"></div>
    <div class="slot-fields">
      <div class="field">
        <input type="text" placeholder="名前を入力">
      </div>
    </div>
  `;

  const body = slot.querySelector(".slot-body");
  body.appendChild(createPlaceholder());

  slot.addEventListener("dragover", e => {
    e.preventDefault();
    slot.classList.add("over");
  });

  slot.addEventListener("dragleave", () => {
    slot.classList.remove("over");
  });

  slot.addEventListener("drop", e => {
    e.preventDefault();
    slot.classList.remove("over");
    const id = e.dataTransfer.getData("text/plain");
    placeCardInSlot(id, slot);
  });

  slot.addEventListener("click", e => {
    if(e.target.tagName === "INPUT") return;
    if(selectedCardId){
      placeCardInSlot(selectedCardId, slot);
      document.querySelectorAll(".card.selected").forEach(el => el.classList.remove("selected"));
      selectedCardId = null;
      updateSelectedStatus();
    }
  });

  return slot;
}

function placeCardInSlot(cardId, slot){
  const card = document.querySelector(`.card[data-id="${cardId}"]`);
  if(!card) return;

  const targetBody = slot.querySelector(".slot-body");
  const existingCard = targetBody.querySelector(".card");
  const currentParentSlot = card.closest(".slot");
  const currentBody = currentParentSlot ? currentParentSlot.querySelector(".slot-body") : null;

  if(existingCard === card) return;

  if(existingCard && currentBody){
    targetBody.innerHTML = "";
    targetBody.appendChild(card);

    currentBody.innerHTML = "";
    currentBody.appendChild(existingCard);
    return;
  }

  if(existingCard){
    pool.appendChild(existingCard);
  }

  if(currentBody){
    currentBody.innerHTML = "";
    currentBody.appendChild(createPlaceholder());
  }

  targetBody.innerHTML = "";
  targetBody.appendChild(card);
}


function clamp(value, min, max){
  return Math.min(Math.max(value, min), max);
}

function closeHints(){
  document.querySelectorAll(".hint-popover.show").forEach(el => el.classList.remove("show"));
}

function positionHint(button, popover){
  const margin = 16;
  const rect = button.getBoundingClientRect();

  popover.classList.add("show");

  const width = Math.min(460, window.innerWidth - margin * 2);
  popover.style.width = width + "px";

  const popRect = popover.getBoundingClientRect();

  let left = rect.left - 42;
  left = clamp(left, margin, window.innerWidth - popRect.width - margin);

  let top = rect.bottom + 10;
  if(top + popRect.height > window.innerHeight - margin){
    top = rect.top - popRect.height - 10;
  }
  top = clamp(top, margin, window.innerHeight - popRect.height - margin);

  popover.style.left = left + "px";
  popover.style.top = top + "px";
}

function bindHintButtons(){
  document.querySelectorAll(".hint-btn").forEach(button => {
    button.addEventListener("click", event => {
      event.stopPropagation();
      const popover = document.getElementById("hint-" + button.dataset.no);
      const wasOpen = popover.classList.contains("show");
      closeHints();
      if(!wasOpen){
        positionHint(button, popover);
      }
    });
  });

  document.querySelectorAll(".hint-close").forEach(button => {
    button.addEventListener("click", event => {
      event.stopPropagation();
      button.closest(".hint-popover").classList.remove("show");
    });
  });
}

document.addEventListener("click", closeHints);
document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeHints();
});
window.addEventListener("resize", closeHints);
window.addEventListener("scroll", closeHints, true);

function buildAnswerArea(){
  answerGrid.innerHTML = "";
  groups.forEach(group => {
    const section = document.createElement("section");
    section.className = "answer-group";

    const title = document.createElement("h3");
    title.className = "answer-group-title";
    title.textContent = group.title;
    section.appendChild(title);

    const row = document.createElement("div");
    row.className = `answer-row cols-${group.cols}`;

    for(let i = group.start; i <= group.end; i++){
      const wrap = document.createElement("div");
      wrap.className = "slot-wrap";

      const labelRow = document.createElement("div");
      labelRow.className = "slot-label-row";

      const no = document.createElement("div");
      no.className = "slot-no";
      no.textContent = `【${i}】`;
      labelRow.appendChild(no);

      const hintBtn = document.createElement("button");
      hintBtn.type = "button";
      hintBtn.className = "hint-btn";
      hintBtn.textContent = "?";
      hintBtn.dataset.no = String(i);
      hintBtn.setAttribute("aria-label", "ヒントを表示");

      const hintBox = document.createElement("div");
      hintBox.className = "hint-popover";
      hintBox.id = "hint-" + i;
      hintBox.innerHTML = `
        <button type="button" class="hint-close" aria-label="ヒントを閉じる">×</button>
        <div class="hint-title">【${i}】のヒント：</div>
        <div class="hint-text">${hints[String(i)]}</div>
      `;

      labelRow.appendChild(hintBtn);
      labelRow.appendChild(hintBox);

      wrap.appendChild(labelRow);
      wrap.appendChild(createSlot(i - 1));
      row.appendChild(wrap);
    }

    section.appendChild(row);
    answerGrid.appendChild(section);
  });
}

function resetAll(){
  clearResults();
  document.getElementById("scoreBoard").textContent = "未採点";
  answerGrid.querySelectorAll(".slot").forEach(slot => {
    const body = slot.querySelector(".slot-body");
    const card = body.querySelector(".card");
    if(card) pool.appendChild(card);
    body.innerHTML = "";
    body.appendChild(createPlaceholder());
  });
  answerGrid.querySelectorAll("input").forEach(input => input.value = "");
  document.querySelectorAll(".card.selected").forEach(el => el.classList.remove("selected"));
  selectedCardId = null;
  updateSelectedStatus();
  shufflePool();
}

function shufflePool(){
  const cards = Array.from(pool.children);
  for(let i = cards.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  cards.forEach(card => pool.appendChild(card));
}

buildAnswerArea();
initialItems.forEach(item => pool.appendChild(createCard(item)));
shufflePool();
updateSelectedStatus();
bindHintButtons();
document.getElementById("checkBtn").addEventListener("click", checkAnswers);
resetBtn.addEventListener("click", resetAll);
</script>
