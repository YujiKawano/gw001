<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>グループワークその２（仮面ライダー）</title>
<style>
  :root {
    --panel: #121a30;
    --panel2: #17223f;
    --line: #31436d;
    --text: #eaf0ff;
    --muted: #9fb0d9;
    --accent: #7cb7ff;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    font-family: Arial, "Helvetica Neue", Helvetica, "Yu Gothic", "Yu Gothic UI", Meiryo, sans-serif;
    line-height: 1.4;
    background: linear-gradient(180deg, #08101d, #10172d);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    overflow: hidden;
  }
  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .top {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 20px 20px 0;
    overflow: hidden;
  }
  .title-wrap {
    flex: 0 0 auto;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 28px;
  }
  .lead {
    margin: 0 0 18px;
    color: var(--text);
    line-height: 1.8;
    font-size: 20px;
    font-weight: 800;
  }
  .lead strong {
    color: #ffffff;
    font-size: 24px;
    display: inline-block;
    margin-bottom: 6px;
  }
  button, .answer-link-btn {
    border: 1px solid var(--line);
    background: var(--panel2);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    font-family: inherit;
    line-height: 1.2;
    text-decoration: none;
    display: inline-block;
  }
  button:hover, .answer-link-btn:hover {
    filter: brightness(1.08);
  }
  .panel {
    background: rgba(18,26,48,.92);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .answer-panel {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .answer-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin: 0 0 12px;
    flex: 0 0 auto;
  }

  .answer-actions {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 0 0 auto;
  }
  #answerLinkBtn {
    background: #2f7df0;
    border-color: #2f7df0;
    color: #fff;
  }
  .answer-header h2,
  .rider-header h2 {
    margin: 0;
    font-size: 20px;
  }
  .click-help {
    margin-top: 10px;
    padding: 10px 12px;
    border: 1px solid #385486;
    border-radius: 12px;
    background: rgba(124,183,255,.08);
    color: #d8e7ff;
    font-size: 13px;
    line-height: 1.6;
    flex: 0 0 auto;
  }
  .answer-scroll {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding-right: 6px;
    scrollbar-gutter: stable;
  }
  .answer-groups {
    display: grid;
    gap: 18px;
    min-width: 1180px;
    padding-bottom: 10px;
  }
  .answer-group {
    display: grid;
    gap: 10px;
  }
  .answer-group-title {
    margin: 0;
    font-size: 18px;
    color: #ffffff;
    font-weight: 800;
  }
  .answer-row {
    display: grid;
    gap: 12px;
  }
  .answer-row.cols-7 { grid-template-columns: repeat(7, minmax(150px, 1fr)); }
  .answer-row.cols-8 { grid-template-columns: repeat(8, minmax(150px, 1fr)); }
  .answer-row.cols-10 { grid-template-columns: repeat(10, minmax(150px, 1fr)); }

  .slot-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .slot-no {
    font-size: 12px;
    color: var(--muted);
    font-weight: 800;
    letter-spacing: .04em;
  }
  .slot {
    background: rgba(255,255,255,.03);
    border: 2px dashed #3f5589;
    border-radius: 14px;
    padding: 8px;
    transition: .15s ease;
    display:flex;
    flex-direction:column;
    min-height: 188px;
  }
  .slot.over {
    border-color: var(--accent);
    background: rgba(124,183,255,.12);
    transform: scale(1.01);
  }
  .slot-body {
    min-height: 126px;
    height: 126px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .slot-fields {
    display: grid;
    gap: 8px;
    margin-top: auto;
  }
  .field input {
    width: 100%;
    height: 34px;
    background: rgba(8,16,29,.9);
    border: 1px solid #4a6399;
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 16px;
    font-family: inherit;
    appearance: none;
    -webkit-appearance: none;
  }
  .field input::placeholder {
    color: #6d81b3;
  }
  .placeholder {
    width: 100%;
    font-size: 12px;
    color: #6d81b3;
    text-align: center;
    line-height: 1.5;
  }

  .bottom {
    flex: 0 0 auto;
    padding: 14px 20px 10px;
    position: sticky;
    bottom: 0;
    z-index: 20;
    background: linear-gradient(180deg, rgba(8,16,29,0.4), rgba(8,16,29,0.95) 18%, rgba(8,16,29,1));
    backdrop-filter: blur(2px);
  }
  .rider-panel {
    border-top: 2px solid #4a6399;
    box-shadow: 0 -10px 20px rgba(0,0,0,.28);
  }
  .rider-header {
    margin: 0 0 10px;
  }
  .rider-scroll {
    overflow: auto;
    max-height: 225px;
    scrollbar-gutter: stable;
    padding-right: 6px;
  }
  .pool {
    display: grid;
    grid-template-columns: repeat(8, minmax(120px, 1fr));
    gap: 10px;
    min-width: 1060px;
  }
  .card {
    background: linear-gradient(180deg, #213154, #182440);
    border: 1px solid #47639d;
    border-radius: 14px;
    padding: 8px;
    height: 146px;
    cursor: grab;
    user-select: none;
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card.dragging {
    opacity: .45;
    transform: scale(.98);
  }
  .card.selected {
    border-color: #7fffd4;
    box-shadow: 0 0 0 3px rgba(127,255,212,.25), 0 8px 24px rgba(0,0,0,.22);
  }
  .card img {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    object-position: center center;
    border-radius: 10px;
    display: block;
    background: #0b1020;
  }
  .slot-body > .card {
    width: 100%;
    height: 100%;
  }
  .pool > .card {
    width: 100%;
  }

  .copyright {
    text-align: center;
    font-size: 12px;
    color: #9fb0d9;
    margin-top: 8px;
    padding: 4px 0 2px;
    opacity: 0.8;
  }

  @media (max-width: 1200px) {
    .pool {
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      min-width: 900px;
    }
    .rider-scroll {
      max-height: 205px;
    }
  }
  @media (max-width: 900px) {
    .pool {
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      min-width: 620px;
    }
    .rider-scroll {
      max-height: 185px;
    }
  }
</style>
</head>
  <body>
    <script>
      (function () {
        const pass = prompt("パスワードを入力してください");
      
        if (pass !== "wbx") {
          document.body.innerHTML =
            "<div style='background:#08101d;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;font-family:Arial,\"Yu Gothic\",Meiryo,sans-serif'>アクセスできません</div>";
          throw new Error("Unauthorized");
        }
      })();
      </script>

<div class="app">
  <div class="top">
    <div class="title-wrap">
      <h1>グループワークその２（仮面ライダー）　次の仮面ライダーの名前を答え、登場順に並べよ。</h1>
    </div>

    <section class="panel answer-panel">
      <div class="answer-header">
        <h2>解答エリア</h2>
        <div class="answer-actions">
          <button id="resetBtn" type="button">リセット</button>
          <a id="answerLinkBtn" class="answer-link-btn" href="groupwork002_answer.html" target="_blank" rel="noopener noreferrer">解答へ</a>
        </div>
      </div>

      <div class="answer-scroll">
        <div id="answerGrid" class="answer-groups"></div>
      </div>

      
    </section>
  </div>

  <div class="bottom">
    <section class="panel rider-panel">
      <div class="rider-header">
        <h2>ライダー一覧</h2>
      </div>
      <div class="rider-scroll">
        <div id="pool" class="pool"></div>
      </div>
    </section>
    <footer class="copyright">(C)石森プロ・テレビ朝日・ADK EM・東映</footer>
  </div>
</div>

<script>
const initialItems = [{"id": "r01", "image": "gw02img/hg.png"}, {"id": "r02", "image": "gw02img/im.png"}, {"id": "r03", "image": "gw02img/ks.png"}, {"id": "r04", "image": "gw02img/yj.png"}, {"id": "r05", "image": "gw02img/jk.png"}, {"id": "r06", "image": "gw02img/yd.png"}, {"id": "r07", "image": "gw02img/js.png"}, {"id": "r08", "image": "gw02img/th.png"}, {"id": "r09", "image": "gw02img/ok.png"}, {"id": "r10", "image": "gw02img/mr.png"}, {"id": "r11", "image": "gw02img/mk.png"}, {"id": "r12", "image": "gw02img/mk2.png"}, {"id": "r13", "image": "gw02img/kas.png"}, {"id": "r14", "image": "gw02img/am.png"}, {"id": "r15", "image": "gw02img/sk.png"}, {"id": "r16", "image": "gw02img/gy.png"}, {"id": "r17", "image": "gw02img/ts.png"}, {"id": "r18", "image": "gw02img/kis.png"}, {"id": "r19", "image": "gw02img/it.png"}, {"id": "r20", "image": "gw02img/kk.png"}, {"id": "r21", "image": "gw02img/hh.png"}, {"id": "r22", "image": "gw02img/tendo.png"}, {"id": "r23", "image": "gw02img/ny.png"}, {"id": "r24", "image": "gw02img/kw.png"}, {"id": "r25", "image": "gw02img/kt.png"}, {"id": "r26", "image": "gw02img/hf.png"}, {"id": "r27", "image": "gw02img/he.png"}, {"id": "r28", "image": "gw02img/kg.png"}, {"id": "r29", "image": "gw02img/sh.png"}, {"id": "r30", "image": "gw02img/kko.png"}, {"id": "r31", "image": "gw02img/tos.png"}, {"id": "r32", "image": "gw02img/tt.png"}, {"id": "r33", "image": "gw02img/hoe.png"}, {"id": "r34", "image": "gw02img/ksen.png"}, {"id": "r35", "image": "gw02img/tokis.png"}];
const groups = [{"title": "昭和ライダー1期（栄光の7人ライダー）", "start": 1, "end": 7, "cols": 7}, {"title": "昭和ライダー2期 / 昭和ライダー3期 / 昭和ライダー4期（ネオライダー）", "start": 8, "end": 15, "cols": 8}, {"title": "平成ライダー1期", "start": 16, "end": 25, "cols": 10}, {"title": "平成ライダー2期", "start": 26, "end": 35, "cols": 10}];

const answerGrid = document.getElementById('answerGrid');
const pool = document.getElementById('pool');
const resetBtn = document.getElementById('resetBtn');

let selectedCardId = null;

function createCard(item) {
  const card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;
  card.dataset.id = item.id;

  const img = document.createElement('img');
  img.src = item.image;
  img.alt = item.id;
  card.appendChild(img);

  card.addEventListener('dragstart', (e) => {
    card.classList.add('dragging');
    e.dataTransfer.setData('text/plain', item.id);
  });

  card.addEventListener('dragend', () => {
    card.classList.remove('dragging');
  });

  card.addEventListener('click', () => {
    document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
    if (selectedCardId === item.id) {
      selectedCardId = null;
      return;
    }
    selectedCardId = item.id;
    card.classList.add('selected');
  });

  return card;
}

function createPlaceholder() {
  const p = document.createElement('div');
  p.className = 'placeholder';
  p.innerHTML = 'ライダーを選択<br>→ 配置先をクリック';
  return p;
}

function createSlot(index) {
  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.dataset.index = index;

  slot.innerHTML = `
    <div class="slot-body"></div>
    <div class="slot-fields">
      <div class="field">
        <input type="text" placeholder="ここに入力">
      </div>
    </div>
  `;

  const body = slot.querySelector('.slot-body');
  body.appendChild(createPlaceholder());

  slot.addEventListener('dragover', (e) => {
    e.preventDefault();
    slot.classList.add('over');
  });

  slot.addEventListener('dragleave', () => {
    slot.classList.remove('over');
  });

  slot.addEventListener('drop', (e) => {
    e.preventDefault();
    slot.classList.remove('over');
    const id = e.dataTransfer.getData('text/plain');
    placeCardInSlot(id, slot);
  });

  slot.addEventListener('click', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (selectedCardId) {
      placeCardInSlot(selectedCardId, slot);
      document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
      selectedCardId = null;
    }
  });

  return slot;
}

function placeCardInSlot(cardId, slot) {
  const card = document.querySelector(`.card[data-id="${cardId}"]`);
  if (!card) return;

  const slotBody = slot.querySelector('.slot-body');
  const existingCard = slotBody.querySelector('.card');
  if (existingCard) {
    pool.appendChild(existingCard);
  }

  const currentParentSlot = card.closest('.slot');
  if (currentParentSlot) {
    const currentBody = currentParentSlot.querySelector('.slot-body');
    currentBody.innerHTML = '';
    currentBody.appendChild(createPlaceholder());
  }

  slotBody.innerHTML = '';
  slotBody.appendChild(card);
}

function buildAnswerArea() {
  answerGrid.innerHTML = '';

  groups.forEach(group => {
    const section = document.createElement('section');
    section.className = 'answer-group';

    const title = document.createElement('h3');
    title.className = 'answer-group-title';
    title.textContent = group.title;
    section.appendChild(title);

    const row = document.createElement('div');
    row.className = `answer-row cols-${group.cols}`;

    for (let i = group.start; i <= group.end; i++) {
      const wrap = document.createElement('div');
      wrap.className = 'slot-wrap';

      const no = document.createElement('div');
      no.className = 'slot-no';
      no.textContent = `【${i}】`;

      wrap.appendChild(no);
      wrap.appendChild(createSlot(i - 1));
      row.appendChild(wrap);
    }

    section.appendChild(row);
    answerGrid.appendChild(section);
  });
}

function resetAll() {
  answerGrid.querySelectorAll('.slot').forEach(slot => {
    const body = slot.querySelector('.slot-body');
    const card = body.querySelector('.card');
    if (card) pool.appendChild(card);
    body.innerHTML = '';
    body.appendChild(createPlaceholder());
  });
  answerGrid.querySelectorAll('input').forEach(input => input.value = '');
  document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
  selectedCardId = null;
}

function shufflePool() {
  const cards = Array.from(pool.children);
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  cards.forEach(card => pool.appendChild(card));
}

buildAnswerArea();
initialItems.forEach(item => {
  pool.appendChild(createCard(item));
});
shufflePool();

resetBtn.addEventListener('click', resetAll);
</script>
</body>
</html>
